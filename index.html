<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minecraft風ゲーム</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: monospace; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #coords {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.55);
    padding: 6px 10px; border-radius: 4px;
    font-size: 13px; font-family: monospace;
    pointer-events: none; z-index: 5; white-space: pre;
  }
  #info {
    position: absolute; top: 50px; left: 10px;
    color: white; background: rgba(0,0,0,0.45);
    padding: 6px 10px; border-radius: 4px;
    font-size: 11px; line-height: 1.5;
    pointer-events: none; z-index: 5;
    max-width: calc(100vw - 30px);
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%;
    width: 24px; height: 24px;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 10;
  }
  #hearts {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 2px;
    z-index: 6;
    font-size: 20px;
    line-height: 1;
    pointer-events: none;
    text-shadow: 1px 1px 0 black, -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black;
  }
  #hearts.show { display: flex; }
  .heart { color: #e63946; }
  .heart.empty { color: #421014; }
  #crosshair .ch-h, #crosshair .ch-v {
    position: absolute; background: #fff;
    box-shadow: 0 0 2px #000, 0 0 2px #000;
  }
  #crosshair .ch-h {
    top: 50%; left: 0; right: 0; height: 2px;
    transform: translateY(-50%);
  }
  #crosshair .ch-v {
    left: 50%; top: 0; bottom: 0; width: 2px;
    transform: translateX(-50%);
  }
  #blocker {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; z-index: 10; text-align: center;
    padding: 20px; box-sizing: border-box;
  }
  #blocker h1 { font-size: 28px; margin: 0 0 16px; }
  #blocker p  { font-size: 14px; margin: 4px 0; }
  #progress { width: 240px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 8px 0; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: #6cf; transition: width 0.2s; }
  #hotbar {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(9, 34px);
    gap: 3px; padding: 4px;
    background: rgba(0,0,0,0.45); border-radius: 6px; z-index: 5;
  }
  .slot {
    width: 34px; height: 34px;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
    background-size: cover; image-rendering: pixelated;
    position: relative; cursor: pointer;
    pointer-events: auto; touch-action: manipulation;
  }
  .slot.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
  .slot::after {
    content: attr(data-num); position: absolute;
    top: 1px; left: 3px; color: white; font-size: 10px;
    text-shadow: 1px 1px 0 black, -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black;
  }
  #touchUI { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #touchUI.active { display: block; }
  #joystick {
    position: absolute; bottom: max(80px, env(safe-area-inset-bottom, 0px)); left: 24px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto; touch-action: none;
  }
  #joyKnob {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.8); pointer-events: none;
    transition: transform 0.05s linear;
  }
  .actBtn {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
    color: white; font-size: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
  }
  .actBtn.pressed { background: rgba(255,255,255,0.4); }
  #jumpBtn  { right: 28px;  bottom: max(80px, env(safe-area-inset-bottom, 0px));  width: 80px; height: 80px; }
  #breakBtn { right: 122px; bottom: max(85px, env(safe-area-inset-bottom, 0px));  width: 64px; height: 64px; background: rgba(220,80,80,0.35); border-color: rgba(255,140,140,0.7); }
  #placeBtn { right: 28px;  bottom: max(170px, env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; background: rgba(80,170,220,0.35); border-color: rgba(140,200,255,0.7); }
  #settingsBtn {
    position: absolute; top: 10px; right: 10px;
    width: 42px; height: 42px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    background: rgba(0,0,0,0.55);
    color: white; font-size: 22px;
    cursor: pointer; z-index: 7;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: manipulation;
  }
  #settingsModal {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
  }
  .modal-page {
    background: rgba(30,30,32,0.95);
    border: 2px solid #555; border-radius: 8px;
    padding: 20px 24px;
    width: 280px; max-width: 90vw;
    color: white; font-family: monospace;
  }
  .modal-page h2 { margin: 0 0 14px; text-align: center; font-size: 18px; }
  .modal-page button, .modal-page select {
    display: block; width: 100%; padding: 10px;
    margin: 8px 0; background: #3a3a3a;
    border: 1px solid #666; color: white;
    border-radius: 4px; font-size: 15px;
    cursor: pointer; box-sizing: border-box;
    font-family: monospace;
  }
  .modal-page button:active, .modal-page button:hover { background: #4d4d4d; }
  .modal-page label {
    display: block; margin: 10px 0 4px;
    font-size: 13px; color: #ccc;
  }
  .modal-page input[type=range] {
    width: 100%; margin: 4px 0 10px;
  }
  #damageOverlay {
    position: absolute; inset: 0; background: red; opacity: 0;
    pointer-events: none; z-index: 4; transition: opacity 0.5s;
  }
</style>
</head>
<body>
<div id="damageOverlay"></div>
<div id="coords">XYZ: -- / -- / --</div>
<div id="info">WASD: 移動 / Space: ジャンプ / 左クリック: 壊す / 右クリック: 置く / 1-8: 選択 / N: 設定</div>
<div id="crosshair"><div class="ch-h"></div><div class="ch-v"></div></div>
<div id="hearts"></div>
<button id="settingsBtn" title="設定 (N)">⚙</button>
<div id="settingsModal" style="display:none">
  <div class="modal-page" id="settingsMain">
    <h2>設定</h2>
    <button id="openAudio">オーディオ設定</button>
    <button id="openVideo">ビデオ設定</button>
    <button id="openMode">モード</button>
    <button class="close-settings">閉じる</button>
  </div>
  <div class="modal-page" id="settingsMode" style="display:none">
    <h2>モード</h2>
    <label>ゲームモード:</label>
    <select id="modeSelect">
      <option value="survival" selected>サバイバル</option>
      <option value="creative">クリエイティブ</option>
      <option value="adventure">アドベンチャー</option>
    </select>
    <button class="back-settings">戻る</button>
    <button class="close-settings">閉じる</button>
  </div>
  <div class="modal-page" id="settingsAudio" style="display:none">
    <h2>オーディオ設定</h2>
    <label>BGM音量: <span id="volumeLabel">50</span></label>
    <input type="range" id="bgmSlider" min="0" max="100" value="50">
    <button class="back-settings">戻る</button>
    <button class="close-settings">閉じる</button>
  </div>
  <div class="modal-page" id="settingsVideo" style="display:none">
    <h2>ビデオ設定</h2>
    <label>霧:</label>
    <select id="fogSelect">
      <option value="off">なし</option>
      <option value="weak">弱い</option>
      <option value="normal" selected>普通</option>
      <option value="strong">強い</option>
    </select>
    <label>雲:</label>
    <select id="cloudSelect">
      <option value="show" selected>表示</option>
      <option value="hide">非表示</option>
    </select>
    <label>十字カーソル:</label>
    <select id="crosshairSelect">
      <option value="show" selected>表示</option>
      <option value="hide">非表示</option>
    </select>
    <button class="back-settings">戻る</button>
    <button class="close-settings">閉じる</button>
  </div>
</div>
<div id="blocker">
  <h1>Minecraft風ゲーム</h1>
  <p id="loadingText">ワールド生成中...</p>
  <div id="progress"><div id="progressBar"></div></div>
  <p>WASD: 移動 / Space: ジャンプ / マウス: 視点 / ESC: 終了</p>
  <p>左クリック: 壊す / 右クリック: 置く / 1-8: ブロック選択 / ドアはクリックで開閉 / M: BGMミュート</p>
  <p style="color:#f88">⚠ 緑のクリーパーに近付くと爆発します</p>
</div>
<div id="hotbar">
  <div class="slot selected" data-block="1"  data-num="1"></div>
  <div class="slot"          data-block="2"  data-num="2"></div>
  <div class="slot"          data-block="7"  data-num="3"></div>
  <div class="slot"          data-block="6"  data-num="4"></div>
  <div class="slot"          data-block="4"  data-num="5"></div>
  <div class="slot"          data-block="5"  data-num="6"></div>
  <div class="slot"          data-block="8"  data-num="7"></div>
  <div class="slot"          data-block="11" data-num="8"></div>
  <div class="slot"          data-block="12" data-num="9"></div>
  <div class="slot"          data-block="13" data-num="0"></div>
  <div class="slot"          data-block="9"  data-num="Q"></div>
  <div class="slot"          data-block="10" data-num="E"></div>
  <div class="slot"          data-block="15" data-num="R"></div>
  <div class="slot"          data-block="16" data-num="T"></div>
  <div class="slot"          data-block="17" data-num="Y"></div>
  <div class="slot"          data-block="20" data-num="U"></div>
  <div class="slot"          data-block="100" data-num="I"></div>
</div>
<div id="touchUI">
  <div id="joystick"><div id="joyKnob"></div></div>
  <div id="jumpBtn"  class="actBtn">JUMP</div>
  <div id="breakBtn" class="actBtn">壊す</div>
  <div id="placeBtn" class="actBtn">置く</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}

<script type="module">
import * as THREE from 'three';

const WORLD_SIZE = 4096;
const Y_OFFSET = 100;             // 表示Y = 配列Y - Y_OFFSET (岩盤=配列0=表示-100)
const WORLD_HEIGHT = 200;         // 配列Y 0..199 → 表示Y -100..99
const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 25;
const CHUNK_LAYERS = WORLD_HEIGHT / CHUNK_HEIGHT;   // 8
const CHUNKS_PER_SIDE = WORLD_SIZE / CHUNK_SIZE;    // 48
const VIEW_DIST = 5;
const VVIEW = 2;
const REACH = 6;
const WATER_LEVEL = 120;          // 配列Y (表示20)
const MOUNTAIN_Y = 150;           // 配列Y (表示50)
const SNOW_Y = 164;               // 配列Y (表示64)

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88ccee);
scene.fog = new THREE.Fog(0x88ccee, 48, VIEW_DIST * CHUNK_SIZE - 4);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = false; // 影は重いので無効化
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(50, 100, 30);
scene.add(sun);

// --- Noise ---
function makeHash(seed) {
  return (x, y) => {
    let h = (x * 374761393 + y * 668265263 + seed) | 0;
    h = ((h ^ (h >> 13)) * 1274126177) | 0;
    h = h ^ (h >> 16);
    return (h % 1000000) / 500000 - 1; // -1..1
  };
}
function smoothNoise(hash, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi);
  const b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1);
  const d = hash(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(hash, x, y, octaves = 4, persistence = 0.5) {
  let total = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    total += smoothNoise(hash, x * freq, y * freq) * amp;
    max += amp;
    amp *= persistence;
    freq *= 2;
  }
  return total / max;
}

const heightHash = makeHash(13371);
const mountainHash = makeHash(80085);
const biomeHash = makeHash(42424);
const lakeHash = makeHash(33333);

// 3D ノイズ (洞窟用)
function makeHash3D(seed) {
  return (x, y, z) => {
    let h = (x * 374761393 + y * 668265263 + z * 1597334677 + seed) | 0;
    h = ((h ^ (h >> 13)) * 1274126177) | 0;
    h = ((h ^ (h >> 16)) * 1597334677) | 0;
    return ((h | 0) % 1000000) / 500000 - 1;
  };
}
function smoothNoise3D(hash, x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const c000 = hash(xi,   yi,   zi  );
  const c100 = hash(xi+1, yi,   zi  );
  const c010 = hash(xi,   yi+1, zi  );
  const c110 = hash(xi+1, yi+1, zi  );
  const c001 = hash(xi,   yi,   zi+1);
  const c101 = hash(xi+1, yi,   zi+1);
  const c011 = hash(xi,   yi+1, zi+1);
  const c111 = hash(xi+1, yi+1, zi+1);
  const L = (a, b, t) => a + t * (b - a);
  return L(L(L(c000, c100, u), L(c010, c110, u), v),
           L(L(c001, c101, u), L(c011, c111, u), v), w);
}
const caveHash1 = makeHash3D(7777);
const caveHash2 = makeHash3D(8888);
const stoneHash = makeHash3D(33337);
const entranceHash = makeHash3D(54321);
function isCave(x, y, z) {
  // 低周波 + しきい値高めで広い洞窟空間
  const n1 = smoothNoise3D(caveHash1, x * 0.028, y * 0.055, z * 0.028);
  const n2 = smoothNoise3D(caveHash2, x * 0.024, y * 0.06,  z * 0.024);
  return Math.abs(n1) < 0.24 && Math.abs(n2) < 0.24;
}

function terrainHeightRaw(x, z) {
  const base = fbm(heightHash, x / 80, z / 80, 4);
  const lakeN = fbm(lakeHash, x / 130, z / 130, 2);
  const mtn = fbm(mountainHash, x / 220, z / 220, 3, 0.55);
  let h = (Y_OFFSET + 25) + base * 5;          // 海抜~表示25 を基準
  if (lakeN < -0.05) h -= (-lakeN + 0.05) * 18; // 湖の窪み
  if (mtn > 0.12) {
    const f = (mtn - 0.12) / 0.88;
    const detail = smoothNoise(mountainHash, x / 28, z / 28);
    h += Math.pow(f, 1.35) * 58 + f * detail * 6;
  }
  return Math.max(Y_OFFSET + 8, Math.min(WORLD_HEIGHT - 6, Math.round(h)));
}
let heightMap = null;
function terrainHeight(x, z) {
  if (heightMap && x >= 0 && x < WORLD_SIZE && z >= 0 && z < WORLD_SIZE) {
    return heightMap[x * WORLD_SIZE + z];
  }
  return terrainHeightRaw(x, z);
}
function precomputeHeights() {
  heightMap = new Int16Array(WORLD_SIZE * WORLD_SIZE);
  for (let x = 0; x < WORLD_SIZE; x++)
    for (let z = 0; z < WORLD_SIZE; z++)
      heightMap[x * WORLD_SIZE + z] = terrainHeightRaw(x, z);
}
function isForestAt(x, z) {
  return fbm(biomeHash, x / 110, z / 110, 2) > 0.18;
}

// --- Textures ---
const textureCanvases = {};
function makeTexture(name, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  textureCanvases[name] = c;
  return t;
}
// Minecraft風のシンプルなピクセルテクスチャ
const grassTopTex = makeTexture('grassTop', ctx => {
  ctx.fillStyle = '#5d9d3a'; ctx.fillRect(0, 0, 16, 16);
  const pal = ['#4e8a30', '#6dac46', '#558e34', '#75b34a'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.55) { ctx.fillStyle = pal[(Math.random()*4)|0]; ctx.fillRect(x, y, 1, 1); }
  }
});
const grassSideTex = makeTexture('grassSide', ctx => {
  // dirt 基地
  ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
  const dPal = ['#6d4a30', '#9a734f', '#866043', '#74543b'];
  for (let y = 4; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.55) { ctx.fillStyle = dPal[(Math.random()*4)|0]; ctx.fillRect(x, y, 1, 1); }
  }
  // 草の上面
  ctx.fillStyle = '#5d9d3a'; ctx.fillRect(0, 0, 16, 4);
  const gPal = ['#4e8a30', '#6dac46', '#75b34a'];
  for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.55) { ctx.fillStyle = gPal[(Math.random()*3)|0]; ctx.fillRect(x, y, 1, 1); }
  }
  // 縁の草が下に垂れる
  for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.5) { ctx.fillStyle = '#4e8a30'; ctx.fillRect(x, 4, 1, 1); }
    if (Math.random() < 0.3) { ctx.fillStyle = '#5d9d3a'; ctx.fillRect(x, 5, 1, 1); }
  }
});
const dirtTex = makeTexture('dirt', ctx => {
  ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
  const pal = ['#6d4a30', '#9a734f', '#74543b', '#5a3c25'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.6) { ctx.fillStyle = pal[(Math.random()*4)|0]; ctx.fillRect(x, y, 1, 1); }
  }
});
const cobbleTex = makeTexture('cobble', ctx => {
  ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 16, 16);
  // 4 つの石ブロックパターン + 黒の目地
  const stones = [[0,0,7,7],[8,0,8,7],[0,8,5,8],[6,8,4,8],[11,8,5,8]];
  for (const [sx, sy, sw, sh] of stones) {
    for (let y = sy; y < sy + sh; y++) for (let x = sx; x < sx + sw; x++) {
      const v = 90 + ((Math.random()*60)|0);
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(x, y, 1, 1);
    }
    // ハイライト
    ctx.fillStyle = '#9c9c9c'; ctx.fillRect(sx, sy, sw, 1); ctx.fillStyle = '#a8a8a8'; ctx.fillRect(sx, sy, 1, sh);
    // 影
    ctx.fillStyle = '#5a5a5a'; ctx.fillRect(sx + sw - 1, sy, 1, sh); ctx.fillRect(sx, sy + sh - 1, sw, 1);
  }
  // 黒の目地
  ctx.fillStyle = '#2e2e2e';
  ctx.fillRect(7, 0, 1, 8); ctx.fillRect(0, 7, 16, 1); ctx.fillRect(5, 8, 1, 8); ctx.fillRect(10, 8, 1, 8); ctx.fillRect(0, 15, 16, 1);
});
const bedrockTex = makeTexture('bedrock', ctx => {
  ctx.fillStyle = '#404044'; ctx.fillRect(0, 0, 16, 16);
  const pal = ['#2e2e32', '#52525a', '#3a3a40', '#1e1e22'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    if (Math.random() < 0.7) { ctx.fillStyle = pal[(Math.random()*4)|0]; ctx.fillRect(x, y, 1, 1); }
  }
});
const logSideTex = makeTexture('logSide', ctx => {
  ctx.fillStyle = '#6b4a26'; ctx.fillRect(0, 0, 16, 16);
  // 縦の樹皮
  for (let x = 0; x < 16; x++) {
    ctx.fillStyle = ['#5a3d1f', '#7d5a30', '#6b4a26', '#503419'][(Math.random()*4)|0];

// --- World data (4096x4096 = 巨大なのでチャンク単位で遅延生成) ---
// 各セルは getBlock で問い合わせると次の順で解決される:
//   1) ロード済みチャンクのデータ配列 (高速)
//   2) modifications Map (プレイヤー/構造物による変更)
//   3) generateBlock(x,y,z) (ノイズから on the fly 計算)
const overworldMods = new Map();
const netherMods = new Map();
let modifications = overworldMods;
let inNether = false;
const posKey = (x, y, z) => (x * WORLD_HEIGHT + y) * WORLD_SIZE + z;
const idx = (x, y, z) => (y * WORLD_SIZE + z) * WORLD_SIZE + x; // 互換用 (使われない)

function getBlock(x, y, z) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return 0;
  if (y < 0 || y >= WORLD_HEIGHT) return 0;
  const cx = (x / CHUNK_SIZE) | 0;
  const cy = (y / CHUNK_HEIGHT) | 0;
  const cz = (z / CHUNK_SIZE) | 0;
  const ch = chunks.get(chunkKey(cx, cy, cz));
  if (ch && ch.data) {
    const lx = x - cx * CHUNK_SIZE;
    const ly = y - cy * CHUNK_HEIGHT;
    const lz = z - cz * CHUNK_SIZE;
    return ch.data[(ly * CHUNK_SIZE + lz) * CHUNK_SIZE + lx];
  }
  const key = posKey(x, y, z);
  if (modifications.has(key)) return modifications.get(key);
  return generateBlock(x, y, z);
}

function setWorld(x, y, z, v) {
  // 直書き: modifications に保存 + ロード済みチャンクなら data も更新
  modifications.set(posKey(x, y, z), v);
  const cx = (x / CHUNK_SIZE) | 0;
  const cy = (y / CHUNK_HEIGHT) | 0;
  const cz = (z / CHUNK_SIZE) | 0;
  const ch = chunks.get(chunkKey(cx, cy, cz));
  if (ch && ch.data) {
    const lx = x - cx * CHUNK_SIZE;
    const ly = y - cy * CHUNK_HEIGHT;
    const lz = z - cz * CHUNK_SIZE;
    ch.data[(ly * CHUNK_SIZE + lz) * CHUNK_SIZE + lx] = v;
  }
}

function isAir(x, y, z) {
  if (y < 0) return false;
  if (y >= WORLD_HEIGHT) return true;
  if (x < 0 || x >= WORLD_SIZE) return false;
  if (z < 0 || z >= WORLD_SIZE) return false;
  const t = getBlock(x, y, z);
  return t === 0 || t === 14 || t === 18 || t === 19;
}
function isSolidForCollision(x, y, z) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return true;
  if (y < 0) return true;
  if (y >= WORLD_HEIGHT) return false;
  const t = getBlock(x, y, z);
  return t !== 0 && t !== 9 && t !== 10 && t !== 14 && t !== 18 && t !== 19;
}

// --- ブロック生成 (ノイズから直接) ---
// --- ノイズから1セルのブロック種別を計算 (手続的: 洞窟・溶岩・木も含む) ---
const lavaHash = makeHash3D(45678);
const treeHash = makeHash(123451);

// 各 4x4 グリッドにつき最大 1 本の木中心
function treeCenter(gx, gz) {
  const h = treeHash(gx * 9 + 1, gz * 11 + 3);
  if (h < 0.55) return null;
  const ox = 1 + ((((treeHash(gx, gz) + 1) * 32) | 0) & 3);
  const oz = 1 + ((((treeHash(gx + 17, gz - 5) + 1) * 32) | 0) & 3);
  return { x: gx * 4 + ox, z: gz * 4 + oz };
}
function treeBlockAt(x, y, z, h) {
  // 4x4 セルとその 1 つ隣に木中心がないか走査
  const gx = (x >= 0 ? (x / 4) | 0 : ((x - 3) / 4) | 0);
  const gz = (z >= 0 ? (z / 4) | 0 : ((z - 3) / 4) | 0);
  for (let dgx = -1; dgx <= 1; dgx++) {
    for (let dgz = -1; dgz <= 1; dgz++) {
      const c = treeCenter(gx + dgx, gz + dgz);
      if (!c) continue;
      if (Math.abs(x - c.x) > 2 || Math.abs(z - c.z) > 2) continue;
      if (!isForestAt(c.x, c.z)) continue;
      const ch = terrainHeightRaw(c.x, c.z);
      if (ch >= MOUNTAIN_Y || ch < WATER_LEVEL + 1) continue;
      const trunkH = 4 + ((((treeHash(c.x * 3, c.z * 5) + 1) * 8) | 0) & 1);
      const top = ch + trunkH;
      // 幹
      if (x === c.x && z === c.z && y > ch && y <= top) return 4;
      // 葉 (5x5 下層 + 3x3 上層)
      const dx = x - c.x, dz = z - c.z;
      const mx = Math.abs(dx), mz = Math.abs(dz);
      if (y > ch && y <= top + 1) {
        if (y >= top - 1 && y <= top && mx <= 2 && mz <= 2) {
          if (mx === 2 && mz === 2) {
            const corner = treeHash(c.x + dx * 7, c.z + dz * 11);
            if (corner > 0) return 5;
          } else return 5;
        }
        if (y === top + 1 && mx <= 1 && mz <= 1) {
          if (mx === 1 && mz === 1) {
            const corner = treeHash(c.x + dx * 13, c.z + dz * 9);
            if (corner > 0) return 5;
          } else return 5;
        }
      }
    }
  }
  return 0;
}

function generateBlockNether(x, y, z) {
  if (y === 0) return 3;                       // 岩盤の床
  if (y >= 60) return 0;                       // 上は空気 (天井なし)
  // 洞窟ノイズで空洞を作る
  if (y >= 3 && y < 58 && isCave(x, y, z)) {
    // 低層は溶岩
    if (y <= 15) {
      const lh = lavaHash(x, y, z);
      if (lh > 0.5) {
        const yb = y - 1;
        const belowCave = yb >= 3 && yb < 58 && isCave(x, yb, z);
        if (!belowCave) return 10;
      }
    }
    return 0;
  }
  return 20; // ネザーラック
}

function generateBlock(x, y, z) {
  if (inNether) return generateBlockNether(x, y, z);
  if (y === 0) return 3; // bedrock
  if (y < 0 || y >= WORLD_HEIGHT) return 0;
  const h = terrainHeightRaw(x, z);
  return generateBlockH(x, y, z, h);
}
function generateBlockH(x, y, z, h) {
  if (inNether) return generateBlockNether(x, y, z);
  if (y === 0) return 3;
  // 木 (空中 or 地表上)
  if (y > h && y <= h + 8) {
    const t = treeBlockAt(x, y, z, h);
    if (t) return t;
  }
  if (y > h) {
    if (h < WATER_LEVEL && y <= WATER_LEVEL) return 9; // 湖の水
    return 0;
  }
  // 洞窟
  if (y >= 4 && y < h - 2 && isCave(x, y, z)) {
    if (y >= 12 && y <= 120) {
      const lh = lavaHash(x, y, z);
      if (lh > 0.74) {
        const yb = y - 1;
        const belowCave = yb >= 4 && yb < h - 2 && isCave(x, yb, z);
        if (yb >= 0 && yb <= h && !belowCave) return 10; // 溶岩
      }
    }
    return 0;
  }
  // 固体
  const isMountain = h >= MOUNTAIN_Y;
  const isSnowy = h >= SNOW_Y;
  const isUnderwater = h < WATER_LEVEL;
  if (y === h) {
    if (isSnowy) return 8;
    if (isMountain) return 2;
    if (isUnderwater) return 6;
    return 1;
  }
  const vein = smoothNoise3D(stoneHash, x * 0.22, y * 0.28, z * 0.22);
  if (y <= Y_OFFSET) return vein > 0.18 ? 16 : 15;
  if (!isMountain && y >= h - 3) return 6;
  return vein > 0.18 ? 2 : 7;
}

let SPAWN_X = WORLD_SIZE / 2;
let SPAWN_Z = WORLD_SIZE / 2;

function chooseSpawn() {
  const cx = WORLD_SIZE / 2;
  const cz = WORLD_SIZE / 2;
  for (let r = 0; r <= 220; r += 4) {
    for (let attempts = 0; attempts < 20; attempts++) {
      const angle = Math.random() * Math.PI * 2;
      const tx = ((cx + Math.cos(angle) * r) | 0);
      const tz = ((cz + Math.sin(angle) * r) | 0);
      if (tx < 40 || tx >= WORLD_SIZE - 40 || tz < 40 || tz >= WORLD_SIZE - 40) continue;
      const h = terrainHeight(tx, tz);
      if (h <= WATER_LEVEL + 1) continue;
      if (h >= MOUNTAIN_Y - 8) continue;
      if (isForestAt(tx, tz)) continue;
      SPAWN_X = tx;
      SPAWN_Z = tz;
      return;
    }
  }
}

const tmpMatrix = new THREE.Matrix4();

class Chunk {
  constructor(cx, cy, cz) {
    this.cx = cx; this.cy = cy; this.cz = cz;
    this.meshes = {};
    this.built = false;
    this.data = null;
  }
  ensureData() {
    if (this.data) return;
    const data = new Uint8Array(CHUNK_SIZE * CHUNK_HEIGHT * CHUNK_SIZE);
    const minX = this.cx * CHUNK_SIZE;
    const minY = this.cy * CHUNK_HEIGHT;
    const minZ = this.cz * CHUNK_SIZE;
    // 列ごとに高さをキャッシュ (16x16 = 256 通)
    const heights = new Int16Array(CHUNK_SIZE * CHUNK_SIZE);
    for (let lx = 0; lx < CHUNK_SIZE; lx++)
      for (let lz = 0; lz < CHUNK_SIZE; lz++)
        heights[lx * CHUNK_SIZE + lz] = terrainHeightRaw(minX + lx, minZ + lz);
    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const h = heights[lx * CHUNK_SIZE + lz];
        for (let ly = 0; ly < CHUNK_HEIGHT; ly++) {
          const x = minX + lx, y = minY + ly, z = minZ + lz;
          const key = posKey(x, y, z);
          const t = modifications.has(key) ? modifications.get(key) : generateBlockH(x, y, z, h);
          data[(ly * CHUNK_SIZE + lz) * CHUNK_SIZE + lx] = t;
        }
      }
    }
    this.data = data;
  }
  build() {
    this.dispose();
    this.ensureData();
    const buckets = {};
    const minX = this.cx * CHUNK_SIZE;
    const minY = this.cy * CHUNK_HEIGHT;
    const minZ = this.cz * CHUNK_SIZE;
    const data = this.data;
    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const x = minX + lx;
        const z = minZ + lz;
        for (let ly = 0; ly < CHUNK_HEIGHT; ly++) {
          const y = minY + ly;
          const t = data[(ly * CHUNK_SIZE + lz) * CHUNK_SIZE + lx];
          if (t === 0 || t === 14) continue;
          if (isAir(x+1,y,z) || isAir(x-1,y,z) || isAir(x,y+1,z) ||
              isAir(x,y-1,z) || isAir(x,y,z+1) || isAir(x,y,z-1)) {
            (buckets[t] = buckets[t] || []).push(x, y, z);
          }
        }
      }
    }
    for (const tid in buckets) {
      const positions = buckets[tid];
      const count = positions.length / 3;
      const mat = BLOCK_TYPES[+tid].material;
      const mesh = new THREE.InstancedMesh(blockGeo, mat, count);
      mesh.frustumCulled = true;
      for (let i = 0; i < count; i++) {
        tmpMatrix.makeTranslation(positions[i*3] + 0.5, positions[i*3+1] + 0.5, positions[i*3+2] + 0.5);
        mesh.setMatrixAt(i, tmpMatrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      this.meshes[tid] = mesh;
      scene.add(mesh);
    }
    this.built = true;
  }
  dispose() {
    for (const tid in this.meshes) {
      const m = this.meshes[tid];
      scene.remove(m);
      m.dispose();
    }
    this.meshes = {};
    this.built = false;
  }
}

const chunks = new Map();
const chunkKey = (cx, cy, cz) => cx * 1000000 + cy * 1000 + cz;
const loadQueue = [];
const dirtyChunks = new Set();

function decodeKey(key) {
  const cx = Math.floor(key / 1000000);
  const rem = key - cx * 1000000;
  const cy = Math.floor(rem / 1000);
  const cz = rem - cy * 1000;
  return [cx, cy, cz];
}

function requestChunkLoad(cx, cy, cz) {
  if (cx < 0 || cx >= CHUNKS_PER_SIDE || cz < 0 || cz >= CHUNKS_PER_SIDE) return;
  if (cy < 0 || cy >= CHUNK_LAYERS) return;
  const key = chunkKey(cx, cy, cz);
  if (chunks.has(key)) return;
  loadQueue.push(key);
  chunks.set(key, null); // placeholder so we don't queue twice
}

function processLoadQueue(budgetMs) {
  const start = performance.now();
  while (loadQueue.length > 0 && performance.now() - start < budgetMs) {
    const key = loadQueue.shift();
    const [cx, cy, cz] = decodeKey(key);
    const chunk = new Chunk(cx, cy, cz);
    chunk.build();
    chunks.set(key, chunk);
  }
}

function rebuildDirtyChunks(budget) {
  let used = 0;
  for (const key of [...dirtyChunks]) {
    if (used >= budget) break;
    dirtyChunks.delete(key);
    const chunk = chunks.get(key);
    if (chunk && chunk.built) { chunk.build(); used++; }
  }
}

function markChunkDirty(x, y, z) {
  const cx = (x / CHUNK_SIZE) | 0;
  const cy = (y / CHUNK_HEIGHT) | 0;
  const cz = (z / CHUNK_SIZE) | 0;
  if (cy < 0 || cy >= CHUNK_LAYERS) return;
  if (cx < 0 || cx >= CHUNKS_PER_SIDE || cz < 0 || cz >= CHUNKS_PER_SIDE) return;
  dirtyChunks.add(chunkKey(cx, cy, cz));
}

function setBlock(x, y, z, type) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return;
  if (y < 0 || y >= WORLD_HEIGHT) return;
  if (getBlock(x, y, z) === type) return;
  setWorld(x, y, z, type);
  markChunkDirty(x, y, z);
  // 境界では隣接チャンクも更新
  const lx = x % CHUNK_SIZE, ly = y % CHUNK_HEIGHT, lz = z % CHUNK_SIZE;
  if (lx === 0) markChunkDirty(x - 1, y, z);
  if (lx === CHUNK_SIZE - 1) markChunkDirty(x + 1, y, z);
  if (ly === 0) markChunkDirty(x, y - 1, z);
  if (ly === CHUNK_HEIGHT - 1) markChunkDirty(x, y + 1, z);
  if (lz === 0) markChunkDirty(x, y, z - 1);
  if (lz === CHUNK_SIZE - 1) markChunkDirty(x, y, z + 1);
}

function updateChunkStreaming() {
  const pcx = Math.floor(player.position.x / CHUNK_SIZE);
  const pcy = Math.floor(player.position.y / CHUNK_HEIGHT);
  const pcz = Math.floor(player.position.z / CHUNK_SIZE);
  const wanted = new Set();
  const pending = [];
  for (let dy = -VVIEW; dy <= VVIEW; dy++)
    for (let dz = -VIEW_DIST; dz <= VIEW_DIST; dz++)
      for (let dx = -VIEW_DIST; dx <= VIEW_DIST; dx++) {
        const cx = pcx + dx, cy = pcy + dy, cz = pcz + dz;
        if (cx < 0 || cx >= CHUNKS_PER_SIDE) continue;
        if (cz < 0 || cz >= CHUNKS_PER_SIDE) continue;
        if (cy < 0 || cy >= CHUNK_LAYERS) continue;
        const key = chunkKey(cx, cy, cz);
        wanted.add(key);
        if (!chunks.has(key)) pending.push({ cx, cy, cz, d: dx*dx + dy*dy*3 + dz*dz });
      }
  pending.sort((a, b) => a.d - b.d);
  for (const p of pending) requestChunkLoad(p.cx, p.cy, p.cz);
  // アンロード
  for (const [key, chunk] of chunks) {
    if (!wanted.has(key)) {
      if (chunk) chunk.dispose();
      chunks.delete(key);
    }
  }
}

// --- 雲 ---
let cloudsVisible = true;
const cloudGroup = new THREE.Group();
const CLOUD_TILE_REPEAT = 18;             // 多めの繰り返し = 雲が密に
const CLOUD_PLANE_SIZE = 900;             // カメラ far より少し小さい (= プレイヤー追従して常に頭上)
(function createClouds() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0, 0, 128, 128);
  // たくさんのピクセル雲を散りばめる
  for (let i = 0; i < 45; i++) {
    const sx = Math.floor(Math.random() * 120);
    const sy = Math.floor(Math.random() * 120);
    const w = 5 + Math.floor(Math.random() * 16);
    const h = 4 + Math.floor(Math.random() * 10);
    cx.fillStyle = 'rgba(255,255,255,0.98)';
    cx.fillRect(sx, sy, w, h);
    cx.fillStyle = 'rgba(220,225,235,0.85)';
    cx.fillRect(sx, sy + h, w, 1);
    cx.fillRect(sx - 1, sy, 1, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(CLOUD_TILE_REPEAT, CLOUD_TILE_REPEAT);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, opacity: 0.95,
    depthWrite: false, side: THREE.DoubleSide,
    fog: false                            // 霧の影響を受けず常時はっきり見える
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(CLOUD_PLANE_SIZE, CLOUD_PLANE_SIZE), mat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = 188;
  cloudGroup.add(plane);
  scene.add(cloudGroup);
})();
let cloudDriftX = 0;
function updateClouds(dt) {
  cloudGroup.visible = cloudsVisible && !inNether;
  if (!cloudGroup.visible) return;
  // 雲レイヤーをプレイヤーの真上に追従させる (常に頭上に雲が見える)
  cloudGroup.position.x = player.position.x;
  cloudGroup.position.z = player.position.z;
  cloudDriftX += dt * 1.2;                // 風の速度 (blocks/sec)
  const tex = cloudGroup.children[0].material.map;
  if (tex) {
    const tileSize = CLOUD_PLANE_SIZE / CLOUD_TILE_REPEAT;
    // プレイヤー位置オフセットで雲は世界に固定 + ドリフトで風が吹く感じ
    tex.offset.x = ((player.position.x + cloudDriftX) / tileSize) % 1;
    tex.offset.y = (player.position.z / tileSize) % 1;
  }
}

// --- 流体シミュレーション (水 9 / 溶岩 10) ---
const fluidQueue = []; // { x, y, z, type, distance }
const FLUID_SPREAD = { 9: 6, 10: 3 };
let fluidTimer = 0;
const FLUID_INTERVAL = 0.25;

function scheduleFluid(x, y, z, type, distance) {
  fluidQueue.push({ x, y, z, type, distance });
}
function hasNeighborOfType(x, y, z, t) {
  return getBlock(x+1,y,z) === t || getBlock(x-1,y,z) === t ||
         getBlock(x,y+1,z) === t || getBlock(x,y-1,z) === t ||
         getBlock(x,y,z+1) === t || getBlock(x,y,z-1) === t;
}
// 流体を 1 セルに「入れる」。反対の流体と接触したら丸石 (溶岩→水) /
// 黒曜石 (水→溶岩) に変化させ、流体としての伝播は止める。
// 戻り値: true なら継続して流れる、false なら止まる
function flowFluidInto(x, y, z, type) {
  if (type === 10 && hasNeighborOfType(x, y, z, 9)) {
    setBlock(x, y, z, 2); // 溶岩が水に触れた -> 丸石
    return false;
  }
  if (type === 9 && hasNeighborOfType(x, y, z, 10)) {
    setBlock(x, y, z, 17); // 水が溶岩に触れた -> 黒曜石
    return false;
  }
  setBlock(x, y, z, type);
  return true;
}
function updateFluids(dt) {
  fluidTimer += dt;
  if (fluidTimer < FLUID_INTERVAL) return;
  fluidTimer = 0;
  if (fluidQueue.length === 0) return;
  const batch = fluidQueue.splice(0, 250);
  for (const f of batch) {
    const { x, y, z, type, distance } = f;
    if (getBlock(x, y, z) !== type) continue;
    const limit = FLUID_SPREAD[type] ?? 6;
    // 下方向
    const by = y - 1;
    if (by >= 0 && getBlock(x, by, z) === 0) {
      if (flowFluidInto(x, by, z, type)) scheduleFluid(x, by, z, type, 0);
      continue;
    }
    // 横方向
    if (distance < limit) {
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const [dx, dz] of dirs) {
        const nx = x + dx, nz = z + dz;
        if (nx < 0 || nx >= WORLD_SIZE || nz < 0 || nz >= WORLD_SIZE) continue;
        if (getBlock(nx, y, nz) === 0) {
          if (flowFluidInto(nx, y, nz, type)) scheduleFluid(nx, y, nz, type, distance + 1);
        }
      }
    }
  }
}

// --- 火と着火 ---
const FLAMMABLE = new Set([4, 5, 11, 12]); // 原木・葉・板材・階段
const fireQueue = []; // {x,y,z,life}
const FIRE_LIFE = 18;
const FIRE_TICK = 1.5;
let fireTimer = 0;
function spawnFire(x, y, z, life = FIRE_LIFE) {
  setBlock(x, y, z, 18);
  fireQueue.push({ x, y, z, life });
}
function igniteAt(blockX, blockY, blockZ) {
  // 対象ブロックの上に火を置く
  const fx = blockX, fy = blockY + 1, fz = blockZ;
  if (fy >= WORLD_HEIGHT) return false;
  const cur = getBlock(fx, fy, fz);
  if (cur !== 0 && cur !== 18) return false;
  const targetBlock = getBlock(blockX, blockY, blockZ);
  if (targetBlock === 0 || targetBlock === 9 || targetBlock === 10) return false;
  // 黒曜石ならポータル発動を試す
  if (targetBlock === 17 && tryActivatePortal(fx, fy, fz)) return true;
  if (cur === 18) return true;
  spawnFire(fx, fy, fz);
  return true;
}
function updateFire(dt) {
  fireTimer += dt;
  if (fireTimer < FIRE_TICK) return;
  fireTimer = 0;
  for (let i = fireQueue.length - 1; i >= 0; i--) {
    const f = fireQueue[i];
    if (getBlock(f.x, f.y, f.z) !== 18) { fireQueue.splice(i, 1); continue; }
    f.life -= FIRE_TICK;
    if (f.life <= 0) { setBlock(f.x, f.y, f.z, 0); fireQueue.splice(i, 1); continue; }
    // 下の支えが無くなれば消える
    const below = getBlock(f.x, f.y - 1, f.z);
    if (below === 0 || below === 18 || below === 9) {
      setBlock(f.x, f.y, f.z, 0);
      fireQueue.splice(i, 1);
      continue;
    }
    // 隣の可燃ブロックの上に伝播
    if (Math.random() < 0.5) {
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (const [dx, dz] of dirs) {
        const nx = f.x + dx, nz = f.z + dz;
        const nb = getBlock(nx, f.y - 1, nz);
        if (FLAMMABLE.has(nb) && getBlock(nx, f.y, nz) === 0) {
          spawnFire(nx, f.y, nz);
          break;
        }
      }
    }
    // 近くの動物にダメージ
    for (const e of entities) {
      if (e.dead) continue;
      const ex = e.group.position.x | 0;
      const ey = e.group.position.y | 0;
      const ez = e.group.position.z | 0;
      if (Math.abs(ex - f.x) <= 1 && Math.abs(ez - f.z) <= 1 &&
          Math.abs(ey - f.y) <= 1) {
        e.takeDamage(2);
      }
    }
  }
}

// --- ネザーポータル ---
function tryActivatePortal(x, y, z) {
  // x,y,z は火が置かれる候補セル (= 内部の底)
  for (const axis of [0, 1]) {
    const ax = axis === 0 ? 1 : 0;
    const az = axis === 0 ? 0 : 1;
    for (let di = -1; di <= 0; di++) {
      const bx = x + di * ax;
      const by = y;
      const bz = z + di * az;
      if (checkPortalFrame(bx, by, bz, ax, az)) {
        // 内部 2x3 をポータルブロックに
        for (let i = 0; i < 2; i++)
          for (let j = 0; j < 3; j++)
            setBlock(bx + i*ax, by + j, bz + i*az, 19);
        return true;
      }
    }
  }
  return false;
}
function checkPortalFrame(bx, by, bz, ax, az) {
  // 内部 2x3 (bx,by,bz から ax/az 方向)
  for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) {
    const t = getBlock(bx + i*ax, by + j, bz + i*az);
    if (t !== 0 && t !== 18) return false;
  }
  // 上下 (各 2 ブロック)
  for (let i = 0; i < 2; i++) {
    if (getBlock(bx + i*ax, by - 1, bz + i*az) !== 17) return false;
    if (getBlock(bx + i*ax, by + 3, bz + i*az) !== 17) return false;
  }
  // 左右 (各 3 ブロック)
  for (let j = 0; j < 3; j++) {
    if (getBlock(bx - ax,       by + j, bz - az      ) !== 17) return false;
    if (getBlock(bx + 2*ax,     by + j, bz + 2*az    ) !== 17) return false;
  }
  return true;
}

// ネザー: ワールド全域 (4096x4096) の手続的次元
const NETHER_SPAWN_X = 2048;
const NETHER_SPAWN_Z = 2048;
const NETHER_SPAWN_Y = 25;
let savedOverworldPos = null;
let netherSpawnBuilt = false;
let portalCooldown = 0;

// 世界切替: 現在のチャンクを破棄 + modifications を入れ替え
function switchWorld(toNether) {
  for (const [, chunk] of chunks) { if (chunk) chunk.dispose(); }
  chunks.clear();
  loadQueue.length = 0;
  dirtyChunks.clear();
  inNether = toNether;
  modifications = toNether ? netherMods : overworldMods;
}

function ensureNetherSpawn() {
  if (netherSpawnBuilt) return;
  netherSpawnBuilt = true;
  // スポーン地点を 7x7x5 だけ開ける (上は空気、床はネザーラック)
  for (let dx = -3; dx <= 3; dx++) for (let dz = -3; dz <= 3; dz++) {
    setWorld(NETHER_SPAWN_X + dx, NETHER_SPAWN_Y - 1, NETHER_SPAWN_Z + dz, 20);
    for (let dy = 0; dy <= 4; dy++) {
      setWorld(NETHER_SPAWN_X + dx, NETHER_SPAWN_Y + dy, NETHER_SPAWN_Z + dz, 0);
    }
  }
  // 帰りポータル: 4x5 黒曜石の枠 + 内部 2x3 のポータル
  const fx = NETHER_SPAWN_X - 2, fy = NETHER_SPAWN_Y, fz = NETHER_SPAWN_Z;
  for (let i = 0; i <= 3; i++) {
    setWorld(fx + i, fy,     fz, 17);
    setWorld(fx + i, fy + 4, fz, 17);
  }
  for (let j = 1; j <= 3; j++) {
    setWorld(fx,     fy + j, fz, 17);
    setWorld(fx + 3, fy + j, fz, 17);
  }
  for (let i = 1; i <= 2; i++) for (let j = 1; j <= 3; j++) {
    setWorld(fx + i, fy + j, fz, 19);
  }
}
function enterNether() {
  if (inNether) return;
  savedOverworldPos = { x: player.position.x, y: player.position.y, z: player.position.z };
  switchWorld(true);
  ensureNetherSpawn();
  player.position.set(NETHER_SPAWN_X + 0.5, NETHER_SPAWN_Y + EYE_HEIGHT, NETHER_SPAWN_Z + 0.5);
  velocity.set(0, 0, 0);
  portalCooldown = 2;
  scene.background = new THREE.Color(0x4a1a10);
  if (scene.fog) scene.fog.color.setHex(0x4a1a10);
}
function leaveNether() {
  if (!inNether) return;
  switchWorld(false);
  if (savedOverworldPos) {
    player.position.set(savedOverworldPos.x, savedOverworldPos.y, savedOverworldPos.z);
  } else {
    player.position.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
  }
  velocity.set(0, 0, 0);
  portalCooldown = 2;
  scene.background = new THREE.Color(0x88ccee);
  if (scene.fog) scene.fog.color.setHex(0x88ccee);
}
function checkPortalTouch(dt) {
  if (portalCooldown > 0) { portalCooldown -= dt; return; }
  const px = Math.floor(player.position.x);
  const py = Math.floor(player.position.y - EYE_HEIGHT);
  const pz = Math.floor(player.position.z);
  for (let dy = 0; dy < 2; dy++) {
    if (getBlock(px, py + dy, pz) === 19) {
      if (inNether) leaveNether();
      else enterNether();
      return;
    }
  }
}

function clearSpawnArea() {
  let baseY = terrainHeightRaw(SPAWN_X, SPAWN_Z);
  if (baseY < WATER_LEVEL + 2) baseY = WATER_LEVEL + 2;
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      const x = SPAWN_X + dx, z = SPAWN_Z + dz;
      // 表面 (草) と直下を確実に固体に
      setWorld(x, baseY, z, 1);
      for (let y = baseY - 1; y >= Math.max(1, baseY - 4); y--) {
        const t = getBlock(x, y, z);
        if (t === 0 || t === 9 || t === 10) setWorld(x, y, z, y <= Y_OFFSET ? 15 : 7);
      }
      // 上のスペースを空ける
      for (let y = baseY + 1; y <= baseY + 4; y++) {
        const t = getBlock(x, y, z);
        if (t !== 0 && t !== 9) setWorld(x, y, z, 0);
        if (t === 9) setWorld(x, y, z, 0);
      }
    }
  }
  spawnFeetY = baseY + 1;
  player.position.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
}

const pigBodyMat  = new THREE.MeshLambertMaterial({ color: 0xee9999 });
const pigSnoutMat = new THREE.MeshLambertMaterial({ color: 0xcc7777 });
const creeperBodyMat   = new THREE.MeshLambertMaterial({ color: 0x6dc956 });
const creeperFlashMat  = new THREE.MeshLambertMaterial({ color: 0xfff4c4 });
const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

class Entity {
  constructor(x, y, z) {
    this.group = new THREE.Group();
    this.group.position.set(x, y, z);
    this.velocity = new THREE.Vector3();
    this.dir = Math.random() * Math.PI * 2;
    this.timer = 1 + Math.random() * 3;
    this.legs = [];
    this.legTime = 0;
    this.dead = false;
    this.onGround = false;
    this.radius = 0.4;
    this.height = 1.0;
    this.hp = 10;
    this.hurtTimer = 0;
    scene.add(this.group);
  }
  takeDamage(amount) {
    if (this.dead) return;
    this.hp -= amount;
    this.hurtTimer = 0.18;
    if (this.hp <= 0) this.dead = true;
  }
  tickHurt(dt) {
    if (this.hurtTimer > 0) {
      this.hurtTimer -= dt;
      const f = Math.max(0, this.hurtTimer / 0.18);
      this.group.scale.setScalar(1 + f * 0.18);
    } else if (this.group.scale.x !== 1) {
      this.group.scale.set(1, 1, 1);
    }
  }
  applyGravity(dt) {
    this.velocity.y -= 28 * dt;
    const pos = this.group.position;
    const nx = pos.x + this.velocity.x * dt;
    if (!this.collidesAt(nx, pos.y, pos.z)) pos.x = nx; else this.velocity.x = 0;
    const nz = pos.z + this.velocity.z * dt;
    if (!this.collidesAt(pos.x, pos.y, nz)) pos.z = nz; else this.velocity.z = 0;
    const ny = pos.y + this.velocity.y * dt;
    if (!this.collidesAt(pos.x, ny, pos.z)) { pos.y = ny; this.onGround = false; }
    else {
      if (this.velocity.y < 0) this.onGround = true;
      this.velocity.y = 0;
    }
  }
  collidesAt(x, y, z) {
    const r = this.radius;
    const minX = Math.floor(x - r), maxX = Math.floor(x + r);
    const minZ = Math.floor(z - r), maxZ = Math.floor(z + r);
    const minY = Math.floor(y), maxY = Math.floor(y + this.height);
    for (let bx = minX; bx <= maxX; bx++)
      for (let by = minY; by <= maxY; by++)
        for (let bz = minZ; bz <= maxZ; bz++)
          if (isSolidForCollision(bx, by, bz)) return true;
    return false;
  }
  animateLegs(speed) {
    this.legTime += speed;
    if (this.legs.length < 4) return;
    const s = Math.sin(this.legTime) * 0.5;
    this.legs[0].rotation.x = s;
    this.legs[3].rotation.x = s;
    this.legs[1].rotation.x = -s;
    this.legs[2].rotation.x = -s;
  }
  restLegs() {
    for (const leg of this.legs) leg.rotation.x = 0;
  }
}

      if (this.state === 'wander') this.dir = Math.random() * Math.PI * 2;

      if (this.onGround) {
        const fx = this.group.position.x + Math.sin(this.dir) * 0.6;
        const fz = this.group.position.z + Math.cos(this.dir) * 0.6;
        if (this.collidesAt(fx, this.group.position.y, fz) &&
            !this.collidesAt(fx, this.group.position.y + 1, fz)) {
          this.velocity.y = 6.5;

    } else {
      this.velocity.x = 0; this.velocity.z = 0;

class Creeper extends Entity {
  constructor(x, y, z) {
    super(x, y, z);
    this.radius = 0.32;
    this.height = 2.0;
    this.body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.1, 0.4), creeperBodyMat);
    this.body.position.y = 0.95;
    this.group.add(this.body);
    this.head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), creeperBodyMat);
    this.head.position.y = 1.77;
    this.group.add(this.head);
    // 顔
    const eyeGeo = new THREE.BoxGeometry(0.13, 0.13, 0.01);
    const eL = new THREE.Mesh(eyeGeo, blackMat); eL.position.set(-0.13, 1.85, 0.28); this.head.add(eL);
    const eR = new THREE.Mesh(eyeGeo, blackMat); eR.position.set( 0.13, 1.85, 0.28); this.head.add(eR);
    // mouth: simple frown
    const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.01), blackMat); m1.position.set(0, 1.66, 0.28); this.head.add(m1);
    const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.01), blackMat); m2.position.set(0, 1.74, 0.28); this.head.add(m2);
    // 4本足
    const legGeo = new THREE.BoxGeometry(0.18, 0.4, 0.25);
    for (const [lx, lz] of [[-0.13, 0.13], [0.13, 0.13], [-0.13, -0.13], [0.13, -0.13]]) {
      const leg = new THREE.Mesh(legGeo, creeperBodyMat);
      leg.position.set(lx, 0.2, lz);
      this.group.add(leg);
      this.legs.push(leg);
    }
    this.state = 'roam';
    this.fuse = 0;
    this.exploded = false;
  }
  setFlash(on) {
    const mat = on ? creeperFlashMat : creeperBodyMat;
    this.body.material = mat;
    this.head.material = mat;
    for (const leg of this.legs) leg.material = mat;
  }
  update(dt) {
    if (this.exploded) return;
    const pos = this.group.position;
    const dx = player.position.x - pos.x;
    const dy = (player.position.y - EYE_HEIGHT) - pos.y;
    const dz = player.position.z - pos.z;
    const dist = Math.hypot(dx, dz);

    if (gameMode !== 'creative' && dist < 1.6 && Math.abs(dy) < 2.2) {
      this.detonate();
      return;
    }

    if (gameMode !== 'creative' && dist < 16) {
      // プレイヤーを追う
      this.dir = Math.atan2(dx, dz);
      const speed = 2.0;
      this.velocity.x = Math.sin(this.dir) * speed;
      this.velocity.z = Math.cos(this.dir) * speed;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 9);
      if (this.onGround) {
        const fx = pos.x + Math.sin(this.dir) * 0.5;
        const fz = pos.z + Math.cos(this.dir) * 0.5;
        if (this.collidesAt(fx, pos.y, fz) && !this.collidesAt(fx, pos.y + 1, fz)) {
          this.velocity.y = 7;
        }
      }
    } else {
      // ぶらつき
      this.timer -= dt;
      if (this.timer <= 0) {
        this.dir = Math.random() * Math.PI * 2;
        this.timer = 2 + Math.random() * 3;
      }
      const speed = 0.8;
      this.velocity.x = Math.sin(this.dir) * speed;
      this.velocity.z = Math.cos(this.dir) * speed;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 5);
    }
    this.applyGravity(dt);
  }
  detonate() {
    if (this.exploded) return;
    this.exploded = true;
    this.dead = true;
    explode(this.group.position.x, this.group.position.y + 0.5, this.group.position.z);
  }
}

    const eR = new THREE.Mesh(eyeGeo, this.eyeMat); eR.position.set( 0.16, 2.65, 0.305); this.group.add(eR);

    const armL = new THREE.Mesh(armGeo, golemBodyMat); armL.position.set(-0.75, 1.35, 0); this.group.add(armL);
    const armR = new THREE.Mesh(armGeo, golemBodyMat); armR.position.set( 0.75, 1.35, 0); this.group.add(armR);
    const legGeo = new THREE.BoxGeometry(0.42, 0.7, 0.45);
    const legL = new THREE.Mesh(legGeo, golemBodyMat); legL.position.set(-0.28, 0.35, 0); this.group.add(legL);
    const legR = new THREE.Mesh(legGeo, golemBodyMat); legR.position.set( 0.28, 0.35, 0); this.group.add(legR);
    this.legs.push(legL, legR);
    this.homeX = x; this.homeZ = z;
    this.angryAtPlayer = false;
    this.angerTimer = 0;
  }
  takeDamage(amount) {
    super.takeDamage(amount);
    if (gameMode !== 'creative') {
      this.angryAtPlayer = true;
      this.angerTimer = 12; // 12 秒は追いかけ続ける
    }
  }
  update(dt) {
    if (this.angerTimer > 0) {
      this.angerTimer -= dt;
      if (this.angerTimer <= 0) this.angryAtPlayer = false;
    }
    // 目の色: 怒り中は明るい赤、平常時は普通
    this.eyeMat.color.setHex(this.angryAtPlayer ? 0xff1010 : 0xff5040);
    // 近くのクリーパー/ゾンビを探して攻撃
    let target = null, targetD = 16;
    for (const e of entities) {
      if (e === this || e.dead) continue;
      if (!(e instanceof Creeper) && !(e instanceof Zombie)) continue;
      if (e instanceof Creeper && e.exploded) continue;
      const dx = e.group.position.x - this.group.position.x;
      const dz = e.group.position.z - this.group.position.z;
      const d = Math.hypot(dx, dz);
      if (d < targetD) { target = e; targetD = d; }
    }
    // プレイヤーに殴られたら反撃: プレイヤーを優先ターゲットに
    let targetIsPlayer = false;
    if (this.angryAtPlayer && gameMode !== 'creative') {
      const pdx = player.position.x - this.group.position.x;
      const pdz = player.position.z - this.group.position.z;
      const pd = Math.hypot(pdx, pdz);
      if (pd < 24) {
        target = null;
        targetIsPlayer = true;
        targetD = pd;
      }
    }
    this.attackCooldown -= dt;
    if (targetIsPlayer) {
      const dx = player.position.x - this.group.position.x;
      const dz = player.position.z - this.group.position.z;
      const d = Math.hypot(dx, dz);
      this.dir = Math.atan2(dx, dz);
      this.velocity.x = Math.sin(this.dir) * 2.2;
      this.velocity.z = Math.cos(this.dir) * 2.2;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 7);
      if (d < 1.9 && this.attackCooldown <= 0) {
        takeDamage(3);
        // ノックバック
        velocity.x += Math.sin(this.dir) * 5;
        velocity.z += Math.cos(this.dir) * 5;
        velocity.y = Math.max(velocity.y, 4);
        this.attackCooldown = 0.7;
      }
    } else if (target) {
      const dx = target.group.position.x - this.group.position.x;
      const dz = target.group.position.z - this.group.position.z;
      const d = Math.hypot(dx, dz);
      this.dir = Math.atan2(dx, dz);
      this.velocity.x = Math.sin(this.dir) * 2.0;
      this.velocity.z = Math.cos(this.dir) * 2.0;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 7);
      if (d < 1.8 && this.attackCooldown <= 0) {
        target.takeDamage(4);
        this.attackCooldown = 0.6;
      }
    } else {
      this.timer -= dt;
      if (this.timer <= 0) {
        const dx = this.homeX - this.group.position.x;
        const dz = this.homeZ - this.group.position.z;
        if (Math.hypot(dx, dz) > 14) this.dir = Math.atan2(dx, dz);
        else this.dir = Math.random() * Math.PI * 2;
        this.timer = 3 + Math.random() * 4;
      }
      this.velocity.x = Math.sin(this.dir) * 0.6;
      this.velocity.z = Math.cos(this.dir) * 0.6;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 4);
    }
    if (this.onGround) {
      const fx = this.group.position.x + Math.sin(this.dir) * 0.6;
      const fz = this.group.position.z + Math.cos(this.dir) * 0.6;
      if (this.collidesAt(fx, this.group.position.y, fz) &&
          !this.collidesAt(fx, this.group.position.y + 1, fz)) this.velocity.y = 7;
    }
    this.applyGravity(dt);
  }
}

      const pdy = (player.position.y - EYE_HEIGHT) - this.group.position.y;
      const pdd = Math.hypot(pdx, pdz);
      if (pdd < td && Math.abs(pdy) < 3) {
        td = pdd;
        target = null;
        targetIsPlayer = true;
      }
    }
    this.attackCooldown -= dt;
    if (targetIsPlayer) {
      const dx = player.position.x - this.group.position.x;
      const dz = player.position.z - this.group.position.z;
      const d = Math.hypot(dx, dz);
      this.dir = Math.atan2(dx, dz);
      this.velocity.x = Math.sin(this.dir) * 1.5;
      this.velocity.z = Math.cos(this.dir) * 1.5;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 8);
      if (d < 1.5 && this.attackCooldown <= 0) {
        takeDamage(1);
        this.attackCooldown = 0.7;
      }
      if (this.onGround) {
        const fx = this.group.position.x + Math.sin(this.dir) * 0.5;
        const fz = this.group.position.z + Math.cos(this.dir) * 0.5;
        if (this.collidesAt(fx, this.group.position.y, fz) &&
            !this.collidesAt(fx, this.group.position.y + 1, fz)) this.velocity.y = 7;
      }
    } else if (target) {
      const dx = target.group.position.x - this.group.position.x;
      const dz = target.group.position.z - this.group.position.z;
      const d = Math.hypot(dx, dz);
      this.dir = Math.atan2(dx, dz);
      this.velocity.x = Math.sin(this.dir) * 1.5;
      this.velocity.z = Math.cos(this.dir) * 1.5;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 8);
      if (d < 1.5 && this.attackCooldown <= 0) {
        target.takeDamage(1);
        this.attackCooldown = 0.7;
      }
      if (this.onGround) {
        const fx = this.group.position.x + Math.sin(this.dir) * 0.5;
        const fz = this.group.position.z + Math.cos(this.dir) * 0.5;
        if (this.collidesAt(fx, this.group.position.y, fz) &&
            !this.collidesAt(fx, this.group.position.y + 1, fz)) this.velocity.y = 7;
      }
    } else {
      this.timer -= dt;
      if (this.timer <= 0) {
        const dx = this.homeX - this.group.position.x;
        const dz = this.homeZ - this.group.position.z;
        if (Math.hypot(dx, dz) > 35) this.dir = Math.atan2(dx, dz);
        else this.dir = Math.random() * Math.PI * 2;
        this.timer = 2 + Math.random() * 3;
      }
      this.velocity.x = Math.sin(this.dir) * 0.9;
      this.velocity.z = Math.cos(this.dir) * 0.9;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 5);
    }
    this.applyGravity(dt);
  }
}

// --- 村 ---
function buildHouse(hx, hz, floorY) {
  const W = 5;
  for (let h = 1; h <= 3; h++) {
    for (let dx = 0; dx < W; dx++) {
      for (let dz = 0; dz < W; dz++) {
        const isPerim = dx === 0 || dx === W-1 || dz === 0 || dz === W-1;
        if (!isPerim) continue;
        const isCorner = (dx === 0 || dx === W-1) && (dz === 0 || dz === W-1);
        setWorld(hx + dx, floorY + h, hz + dz, isCorner ? 4 : 11);
      }
    }
  }
  // ドア (前面 dz=0, dx=2): 下 + 上
  setWorld(hx + 2, floorY + 1, hz, 13);
  setWorld(hx + 2, floorY + 2, hz, 13);
  registerDoor(hx + 2, floorY + 1, hz);
  // 上面 (屋根) は階段でピラミッド風に
  for (let dx = 0; dx < W; dx++)
    for (let dz = 0; dz < W; dz++)
      setWorld(hx + dx, floorY + 4, hz + dz, 12);
  // 玄関ステップ
  if (hz > 0) setWorld(hx + 2, floorY, hz - 1, 12);
  // 室内クリア
  for (let h = 1; h <= 3; h++)
    for (let dx = 1; dx < W - 1; dx++)
      for (let dz = 1; dz < W - 1; dz++)
        setWorld(hx + dx, floorY + h, hz + dz, 0);
}

function buildVillage(cx, cz, baseY) {
  // 整地: 周囲 32×34
  for (let dx = -16; dx <= 16; dx++) {
    for (let dz = -16; dz <= 18; dz++) {
      const tx = cx + dx, tz = cz + dz;
      if (tx < 2 || tx >= WORLD_SIZE - 2 || tz < 2 || tz >= WORLD_SIZE - 2) continue;
      // 地表より上の自然物 (木の葉など) を 8 段だけ撤去
      for (let y = baseY + 1; y <= baseY + 8 && y < WORLD_HEIGHT; y++) {
        const t = getBlock(tx, y, tz);
        if (t !== 0 && t !== 9) setWorld(tx, y, tz, 0);
      }
      setWorld(tx, baseY, tz, 1);
    }
  }
  // 10 軒の家 (3×3 + 1)
  const housePositions = [
    [cx - 14, cz - 14], [cx - 4, cz - 14], [cx + 6, cz - 14],
    [cx - 14, cz - 4 ],                     [cx + 6, cz - 4 ],
    [cx - 14, cz + 6 ], [cx - 4, cz + 6 ], [cx + 6, cz + 6 ],
                        [cx - 4, cz + 14], [cx + 6, cz + 14],
  ];
  for (const [hx, hz] of housePositions) buildHouse(hx, hz, baseY);
  // 中央の十字路
  for (let r = -3; r <= 3; r++) {
    setWorld(cx + r, baseY, cz, 12);
    setWorld(cx, baseY, cz + r, 12);
  }
  // 村人 10 人 + ゴーレム 2 体
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const r = 4 + Math.random() * 5;
    const vx = cx + 0.5 + Math.cos(a) * r;
    const vz = cz + 0.5 + Math.sin(a) * r;
    entities.push(new Villager(vx, baseY + 1, vz));
  }
  entities.push(new IronGolem(cx + 0.5, baseY + 1, cz + 0.5));
  entities.push(new IronGolem(cx - 3.5, baseY + 1, cz + 3.5));
}

const villageLocations = [];

function placeVillages() {
  const TARGET = 2;
  // 1 つ目: プレイヤースポーン地点
  {
    const h = terrainHeight(SPAWN_X, SPAWN_Z);
    villageLocations.push({ x: SPAWN_X, z: SPAWN_Z, y: h });
    buildVillage(SPAWN_X, SPAWN_Z, h);
  }
  for (let attempt = 0; attempt < 600 && villageLocations.length < TARGET; attempt++) {
    const vx = 30 + ((Math.random() * (WORLD_SIZE - 60)) | 0);
    const vz = 30 + ((Math.random() * (WORLD_SIZE - 60)) | 0);
    const h = terrainHeight(vx, vz);
    if (h <= WATER_LEVEL + 1) continue;
    if (h >= MOUNTAIN_Y - 5) continue;
    if (isForestAt(vx, vz)) continue;
    if (Math.abs(vx - SPAWN_X) < 80 && Math.abs(vz - SPAWN_Z) < 80) continue;
    let tooClose = false;
    for (const p of villageLocations) {
      if (Math.abs(p.x - vx) < 140 && Math.abs(p.z - vz) < 140) { tooClose = true; break; }
    }
    if (tooClose) continue;
    villageLocations.push({ x: vx, z: vz, y: h });
    buildVillage(vx, vz, h);
  }
}

// 各村の周りにゾンビを 4 体ずつ
function spawnVillageMobs() {
  for (const v of villageLocations) {
    let zc = 0;
    for (let tries = 0; tries < 120 && zc < 4; tries++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 18 + Math.random() * 18;
      const zx = (v.x + Math.cos(angle) * dist) | 0;
      const zz = (v.z + Math.sin(angle) * dist) | 0;
      if (zx < 4 || zx >= WORLD_SIZE - 4 || zz < 4 || zz >= WORLD_SIZE - 4) continue;
      const h = terrainHeight(zx, zz);
      if (h <= WATER_LEVEL + 1 || h >= MOUNTAIN_Y + 2) continue;
      const top = getBlock(zx, h, zz);
      if (top === 0 || top === 9) continue;
      entities.push(new Zombie(zx + 0.5, h + 1, zz + 0.5, v.x, v.z));
      zc++;
    }
  }
}

// 洞窟内の湧き
// クリーパー: 配列Y 12〜120 (表示Y -88〜20) のみ
// ゾンビ: 洞窟全域
function spawnCaveMobs() {
  // クリーパー (スポーン付近の洞窟に集中)
  let cc = 0;
  for (let attempt = 0; attempt < 6000 && cc < 30; attempt++) {
    const cx = SPAWN_X + ((Math.random() * 600 - 300) | 0);
    const cz = SPAWN_Z + ((Math.random() * 600 - 300) | 0);
    if (cx < 10 || cx >= WORLD_SIZE - 10 || cz < 10 || cz >= WORLD_SIZE - 10) continue;
    if (Math.abs(cx - SPAWN_X) < 28 && Math.abs(cz - SPAWN_Z) < 28) continue;
    for (let tries = 0; tries < 6; tries++) {
      const cy = 12 + ((Math.random() * 108) | 0); // 12..119
      if (getBlock(cx, cy, cz) !== 0) continue;
      if (getBlock(cx, cy + 1, cz) !== 0) continue;
      const below = getBlock(cx, cy - 1, cz);
      if (below === 0 || below === 9 || below === 10) continue;
      entities.push(new Creeper(cx + 0.5, cy, cz + 0.5));
      cc++;
      break;
    }
  }
  // ゾンビ
  let zc = 0;
  for (let attempt = 0; attempt < 8000 && zc < 40; attempt++) {
    const cx = SPAWN_X + ((Math.random() * 600 - 300) | 0);
    const cz = SPAWN_Z + ((Math.random() * 600 - 300) | 0);
    if (cx < 10 || cx >= WORLD_SIZE - 10 || cz < 10 || cz >= WORLD_SIZE - 10) continue;
    const sh = terrainHeightRaw(cx, cz);
    if (Math.abs(cx - SPAWN_X) < 28 && Math.abs(cz - SPAWN_Z) < 28) continue;
    for (let tries = 0; tries < 6; tries++) {
      const cy = 5 + ((Math.random() * Math.max(1, sh - 8)) | 0);
      if (cy < 5 || cy >= sh - 2) continue;
      if (getBlock(cx, cy, cz) !== 0) continue;
      if (getBlock(cx, cy + 1, cz) !== 0) continue;
      const below = getBlock(cx, cy - 1, cz);
      if (below === 0 || below === 9 || below === 10) continue;
      entities.push(new Zombie(cx + 0.5, cy, cz + 0.5, cx, cz));
      zc++;
      break;
    }
  }
}

function spawnEntities() {
  // 豚 (スポーン周辺の森に限定)
  let pigCount = 0;
  for (let attempt = 0; attempt < 1500 && pigCount < 25; attempt++) {
    const x = SPAWN_X + (Math.random() * 600 - 300);
    const z = SPAWN_Z + (Math.random() * 600 - 300);
    if (x < 4 || x >= WORLD_SIZE - 4 || z < 4 || z >= WORLD_SIZE - 4) continue;
    if (!isForestAt(x, z)) continue;
    const ix = x | 0, iz = z | 0;
    const h = terrainHeightRaw(ix, iz);
    if (h >= MOUNTAIN_Y) continue;
    if (h <= WATER_LEVEL) continue;
    if (Math.abs(x - SPAWN_X) < 20 && Math.abs(z - SPAWN_Z) < 20) continue;
    entities.push(new Pig(x, h + 1, z));
    pigCount++;
  }
  spawnCaveMobs();
  spawnVillageMobs();
}

// --- 爆発 ---
const explosionVisuals = [];
const damageOverlayEl = document.getElementById('damageOverlay');

function explode(x, y, z) {
  const R = 4;
  for (let dx = -R; dx <= R; dx++) {
    for (let dy = -R; dy <= R; dy++) {
      for (let dz = -R; dz <= R; dz++) {
        const d = Math.hypot(dx, dy, dz);
        if (d > R) continue;
        const bx = Math.floor(x + dx), by = Math.floor(y + dy), bz = Math.floor(z + dz);
        const t = getBlock(bx, by, bz);
        if (t === 0 || t === 3 || t === 9 || t === 10 || t === 13 || t === 14 || t === 17) continue; // 岩盤・水・溶岩・ドア・黒曜石は壊れない
        if (Math.random() < 1 - d / R - 0.1) setBlock(bx, by, bz, 0);
      }
    }
  }
  // プレイヤー被害
  const dx2 = player.position.x - x;
  const dy2 = (player.position.y - EYE_HEIGHT) - y;
  const dz2 = player.position.z - z;
  const pd = Math.hypot(dx2, dy2, dz2);
  if (pd < R + 2) {
    const scale = 1 - pd / (R + 2);
    const dmg = Math.max(1, Math.ceil(scale * 8));
    takeDamage(dmg);
    if (pd > 0.1 && gameMode !== 'creative') {
      const k = (R + 2 - pd) * 2.5;
      velocity.x = (dx2 / pd) * k;
      velocity.z = (dz2 / pd) * k;
      velocity.y = Math.max(velocity.y, 6);
    }
  }
  // ビジュアル
  const geo = new THREE.SphereGeometry(0.5, 10, 10);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  explosionVisuals.push({ mesh, life: 0.6, total: 0.6 });
}

function updateExplosionVisuals(dt) {
  for (let i = explosionVisuals.length - 1; i >= 0; i--) {
    const e = explosionVisuals[i];
    e.life -= dt;
    if (e.life <= 0) {
      scene.remove(e.mesh);
      e.mesh.geometry.dispose();
      e.mesh.material.dispose();
      explosionVisuals.splice(i, 1);
    } else {
      const t = 1 - e.life / e.total;
      e.mesh.scale.setScalar(0.5 + t * 8);
      e.mesh.material.opacity = 0.8 * (1 - t);
    }
  }
}

if (isTouch) {
  infoEl.textContent = 'スティック: 移動 / 画面: 視点 / JUMP: ジャンプ / 壊す・置く: ボタン';
  const joystickEl = document.getElementById('joystick');
  const joyKnobEl = document.getElementById('joyKnob');
  const jumpBtnEl = document.getElementById('jumpBtn');
  const breakBtnEl = document.getElementById('breakBtn');
  const placeBtnEl = document.getElementById('placeBtn');
  let joyTouchId = null, jumpTouchId = null, lookTouchId = null;
  let lookLastX = 0, lookLastY = 0;

  function updateJoystick(touch) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = touch.clientX - cx, dy = touch.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.hypot(dx, dy);
    if (dist > max) { dx = dx * max / dist; dy = dy * max / dist; }
    joyVec.x = dx / max; joyVec.y = dy / max;
    joyKnobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function resetJoystick() { joyVec.x = 0; joyVec.y = 0; joyKnobEl.style.transform = 'translate(0,0)'; }

  joystickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier; updateJoystick(t);
  }, { passive: false });
  jumpBtnEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (jumpTouchId !== null) return;
    jumpTouchId = e.changedTouches[0].identifier;
    if (!keys.jump) tryJumpTrigger();
    keys.jump = true; jumpBtnEl.classList.add('pressed');
  }, { passive: false });
  breakBtnEl.addEventListener('touchstart', e => { e.preventDefault(); breakBtnEl.classList.add('pressed'); tryBreak(); }, { passive: false });
  breakBtnEl.addEventListener('touchend', () => breakBtnEl.classList.remove('pressed'));
  placeBtnEl.addEventListener('touchstart', e => { e.preventDefault(); placeBtnEl.classList.add('pressed'); tryPlace(); }, { passive: false });
  placeBtnEl.addEventListener('touchend', () => placeBtnEl.classList.remove('pressed'));

  document.addEventListener('touchstart', e => {
    if (lookTouchId !== null) return;
    for (const t of e.changedTouches) {
      const target = t.target;
      if (target.closest('#joystick') || target.closest('#jumpBtn') ||
          target.closest('#breakBtn') || target.closest('#placeBtn') ||
          target.closest('#hotbar') || target.closest('#blocker') ||
          target.closest('#settingsBtn') || target.closest('#settingsModal')) continue;
      lookTouchId = t.identifier; lookLastX = t.clientX; lookLastY = t.clientY; break;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) updateJoystick(t);
      else if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
        lookLastX = t.clientX; lookLastY = t.clientY;
        applyLook(dx * 0.005, dy * 0.005);
      }
    }
  }, { passive: true });
  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) { joyTouchId = null; resetJoystick(); }
      else if (t.identifier === jumpTouchId) { jumpTouchId = null; keys.jump = false; jumpBtnEl.classList.remove('pressed'); }
      else if (t.identifier === lookTouchId) lookTouchId = null;
    }
  }
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);
}

// --- レイキャスト ---
const _origin = new THREE.Vector3();
const _dir = new THREE.Vector3();
function raycastBlock() {
  camera.getWorldPosition(_origin);
  camera.getWorldDirection(_dir);
  let x = Math.floor(_origin.x), y = Math.floor(_origin.y), z = Math.floor(_origin.z);
  const stepX = _dir.x > 0 ? 1 : (_dir.x < 0 ? -1 : 0);
  const stepY = _dir.y > 0 ? 1 : (_dir.y < 0 ? -1 : 0);
  const stepZ = _dir.z > 0 ? 1 : (_dir.z < 0 ? -1 : 0);
  const tDeltaX = stepX === 0 ? Infinity : Math.abs(1 / _dir.x);
  const tDeltaY = stepY === 0 ? Infinity : Math.abs(1 / _dir.y);
  const tDeltaZ = stepZ === 0 ? Infinity : Math.abs(1 / _dir.z);
  let tMaxX = stepX === 0 ? Infinity : (stepX > 0 ? (Math.floor(_origin.x) + 1 - _origin.x) : (_origin.x - Math.floor(_origin.x))) / Math.abs(_dir.x);
  let tMaxY = stepY === 0 ? Infinity : (stepY > 0 ? (Math.floor(_origin.y) + 1 - _origin.y) : (_origin.y - Math.floor(_origin.y))) / Math.abs(_dir.y);
  let tMaxZ = stepZ === 0 ? Infinity : (stepZ > 0 ? (Math.floor(_origin.z) + 1 - _origin.z) : (_origin.z - Math.floor(_origin.z))) / Math.abs(_dir.z);
  let lastAxis = -1, lastSign = 0, t = 0;
  while (t < REACH) {
    if (getBlock(x, y, z) !== 0) {
      let px = x, py = y, pz = z;
      if (lastAxis === 0) px -= lastSign;
      else if (lastAxis === 1) py -= lastSign;
      else if (lastAxis === 2) pz -= lastSign;
      return { x, y, z, placeX: px, placeY: py, placeZ: pz, distance: t };
    }
    if (tMaxX < tMaxY && tMaxX < tMaxZ) { x += stepX; t = tMaxX; tMaxX += tDeltaX; lastAxis = 0; lastSign = stepX; }
    else if (tMaxY < tMaxZ) { y += stepY; t = tMaxY; tMaxY += tDeltaY; lastAxis = 1; lastSign = stepY; }
    else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; lastAxis = 2; lastSign = stepZ; }
  }
  return null;
}

const _entityRaycaster = new THREE.Raycaster();
function raycastEntity() {
  camera.getWorldPosition(_origin);
  camera.getWorldDirection(_dir);
  _entityRaycaster.set(_origin, _dir);
  _entityRaycaster.far = REACH;
  let closest = null;
  let closestDist = REACH + 1;
  for (const e of entities) {
    if (e.dead) continue;
    const dx = e.group.position.x - _origin.x;
    const dy = (e.group.position.y + this_eh(e)) - _origin.y;
    const dz = e.group.position.z - _origin.z;
    if (dx*dx + dy*dy + dz*dz > (REACH + 3) * (REACH + 3)) continue;
    const hits = _entityRaycaster.intersectObject(e.group, true);
    if (hits.length > 0 && hits[0].distance < closestDist) {
      closest = e;
      closestDist = hits[0].distance;
    }
  }
  if (!closest) return null;
  return { entity: closest, distance: closestDist };
}
function this_eh(e) { return (e.height || 1) * 0.5; }

function intersectsPlayer(bx, by, bz) {
  const pos = player.position;
  const minX = pos.x - PLAYER_RADIUS, maxX = pos.x + PLAYER_RADIUS;
  const minZ = pos.z - PLAYER_RADIUS, maxZ = pos.z + PLAYER_RADIUS;
  const feetY = pos.y - EYE_HEIGHT, headY = feetY + PLAYER_HEIGHT;
  return (maxX > bx && minX < bx + 1 && maxZ > bz && minZ < bz + 1 && headY > by && feetY < by + 1);
}

function toggleDoor(x, y, z) {
  const t = getBlock(x, y, z);
  if (t !== 13 && t !== 14) return;
  const newT = t === 13 ? 14 : 13;
  setBlock(x, y, z, newT);
  if (getBlock(x, y + 1, z) === t) setBlock(x, y + 1, z, newT);
  if (getBlock(x, y - 1, z) === t) setBlock(x, y - 1, z, newT);
}

function destroyDoor(x, y, z) {
  const t = getBlock(x, y, z);
  if (t !== 13 && t !== 14) return;
  setBlock(x, y, z, 0);
  const above = getBlock(x, y + 1, z);
  if (above === 13 || above === 14) setBlock(x, y + 1, z, 0);
  const below = getBlock(x, y - 1, z);
  if (below === 13 || below === 14) setBlock(x, y - 1, z, 0);
  for (let i = doors.length - 1; i >= 0; i--) {
    const d = doors[i];
    if (d.x === x && d.z === z && (d.y === y || d.y === y + 1 || d.y === y - 1)) {
      doors.splice(i, 1);
    }
  }
}

function tryBreak() {
  const block = raycastBlock();
  const ent = raycastEntity();
  // モブとブロックで近い方を選ぶ
  if (ent && (!block || ent.distance < block.distance)) {
    ent.entity.takeDamage(1);
    return;
  }
  if (gameMode === 'adventure') return;  // 設置/破壊不可
  if (!block) return;
  const t = getBlock(block.x, block.y, block.z);
  if (t === 13 || t === 14) { destroyDoor(block.x, block.y, block.z); return; }
  if (t === 0 || t === 3 || t === 9 || t === 10) return;
  setBlock(block.x, block.y, block.z, 0);
}
function tryPlace() {
  if (gameMode === 'adventure') return;  // 設置/破壊不可
  const tgt = raycastBlock();
  if (!tgt) return;
  const hit = getBlock(tgt.x, tgt.y, tgt.z);
  // 火打石: 視線の先のブロックに着火 (ドア・ポータルブロック判定より優先)
  if (selectedBlock === 100) {
    igniteAt(tgt.x, tgt.y, tgt.z);
    return;
  }
  if (hit === 13 || hit === 14) { toggleDoor(tgt.x, tgt.y, tgt.z); return; }
  const { placeX: x, placeY: y, placeZ: z } = tgt;
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return;
  if (y < 0 || y >= WORLD_HEIGHT) return;
  const cur = getBlock(x, y, z);
  // 既存ブロックは空気か流体 (流体は上書き可)
  if (cur !== 0 && cur !== 9 && cur !== 10) return;
  if (intersectsPlayer(x, y, z)) return;
  if (selectedBlock === 13) {
    // ドアは2ブロック分必要
    if (y + 1 >= WORLD_HEIGHT) return;
    const above = getBlock(x, y + 1, z);
    if (above !== 0 && above !== 9 && above !== 10) return;
    if (intersectsPlayer(x, y + 1, z)) return;
    setBlock(x, y, z, 13);
    setBlock(x, y + 1, z, 13);
    registerDoor(x, y, z);
    return;
  }
  if (selectedBlock === 9 || selectedBlock === 10) {
    // 設置時にも反対の流体と触れていれば変換
    if (flowFluidInto(x, y, z, selectedBlock)) {
      scheduleFluid(x, y, z, selectedBlock, 0);
    }
    return;
  }
  setBlock(x, y, z, selectedBlock);
}

function updatePlayer(dt) {
  velocity.x *= Math.max(0, 1 - 5 * dt);
  velocity.z *= Math.max(0, 1 - 5 * dt);

  if (isFlying) {
    velocity.y = 0;
    if (keys.jump) velocity.y = 7;
    else if (keys.crouch) velocity.y = -7;
  } else {
    velocity.y -= GRAVITY * dt;
  }

  moveDir.set(0, 0, 0);
  if (keys.forward) moveDir.z -= 1;
  if (keys.back)    moveDir.z += 1;
  if (keys.left)    moveDir.x -= 1;
  if (keys.right)   moveDir.x += 1;
  moveDir.x += joyVec.x;
  moveDir.z += joyVec.y;
  if (moveDir.lengthSq() > 1) moveDir.normalize();

  const yaw = player.rotation.y;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const sp = isFlying ? MOVE_SPEED * 1.6 : MOVE_SPEED;
  const inputX = (moveDir.x * cos + moveDir.z * sin) * sp;
  const inputZ = (-moveDir.x * sin + moveDir.z * cos) * sp;

  if (!isFlying && keys.jump && onGround) { velocity.y = JUMP_SPEED; onGround = false; }

  const pos = player.position;
  const totalX = inputX + velocity.x;
  const totalZ = inputZ + velocity.z;

  const newX = pos.x + totalX * dt;
  if (!playerCollides(newX, pos.y, pos.z)) pos.x = newX; else velocity.x = 0;
  const newZ = pos.z + totalZ * dt;
  if (!playerCollides(pos.x, pos.y, newZ)) pos.z = newZ; else velocity.z = 0;
  const fallSpeed = velocity.y; // 着地前の落下速度を保存
  const newY = pos.y + velocity.y * dt;
  if (!playerCollides(pos.x, newY, pos.z)) { pos.y = newY; onGround = false; }
  else {
    if (velocity.y < 0) {
      onGround = true;
      // 落下ダメージ
      if (!isFlying && fallSpeed < -16) {
        const dmg = Math.floor((-fallSpeed - 13) / 2);
        if (dmg > 0) takeDamage(dmg);
      }
      isFlying = false; // 着地で飛行解除
    }
    velocity.y = 0;
  }

  if (pos.y < -20) respawnPlayer();

  // ハイライト
  const tgt = raycastBlock();
  if (tgt) {
    highlightMesh.position.set(tgt.x + 0.5, tgt.y + 0.5, tgt.z + 0.5);
    highlightMesh.visible = true;
  } else highlightMesh.visible = false;

  // 溶岩ダメージ (1 秒ごとに 2 ダメージ)
  if (playerTouchesBlock(10)) {
    lavaTickTimer += dt;
    if (lavaTickTimer >= 1.0) { takeDamage(2); lavaTickTimer = 0; }
  } else lavaTickTimer = 0;
  // 火ダメージ (0.5 秒ごとに 1 ダメージ)
  if (playerTouchesBlock(18)) {
    fireTickTimer += dt;
    if (fireTickTimer >= 0.5) { takeDamage(1); fireTickTimer = 0; }
  } else fireTickTimer = 0;
  // ポータル接触で次元移動
  checkPortalTouch(dt);

  // ダメージフラッシュのフェードアウト
  if (damageFlashTimer > 0) {
    damageFlashTimer -= dt;
    if (damageFlashTimer <= 0) damageOverlayEl.style.opacity = '0';
  }
}

function updateEntities(dt) {
  const px = player.position.x, pz = player.position.z;
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    const dx = e.group.position.x - px;
    const dz = e.group.position.z - pz;
    if (dx*dx + dz*dz < 90 * 90) e.update(dt);
    e.tickHurt(dt);
    if (e.dead) { scene.remove(e.group); entities.splice(i, 1); }
  }
}

// 村人が近くにいるとドアが自動開閉
// 村人が「ドアを通り抜けたい」と思った時だけ開く: 歩行中 + ドアに向かっている
function updateDoors() {
  const now = performance.now();
  const px = player.position.x, pz = player.position.z;
  for (const d of doors) {
    const dpx = d.x + 0.5 - px;
    const dpz = d.z + 0.5 - pz;
    if (dpx*dpx + dpz*dpz > 100*100) continue;
    let wantsOpen = false;
    for (const e of entities) {
      if (!(e instanceof Villager) || e.dead) continue;
      if (e.state !== 'wander') continue;                     // 立ち止まり中は開けない
      const vx = e.group.position.x - (d.x + 0.5);
      const vy = e.group.position.y - (d.y + 0.5);
      const vz = e.group.position.z - (d.z + 0.5);
      if (Math.abs(vy) > 3) continue;
      const dist = Math.sqrt(vx*vx + vz*vz);
      if (dist >= 2) continue;                                // 2 ブロック以内のみ
      const speed = Math.hypot(e.velocity.x, e.velocity.z);
      if (speed < 0.2) continue;
      // 速度がドアに向いているか
      const dot = (e.velocity.x * -vx + e.velocity.z * -vz) / (speed * Math.max(dist, 0.001));
      if (dot < 0.25) continue;
      wantsOpen = true;
      d.lastNear = now;
      break;
    }
    const cur = getBlock(d.x, d.y, d.z);
    if (wantsOpen && cur === 13) toggleDoor(d.x, d.y, d.z);
    else if (!wantsOpen && cur === 14 && now - d.lastNear > 2000) toggleDoor(d.x, d.y, d.z);
  }
}

let audioCtx = null;
let masterGain = null;
let bgmPlaying = false;
let bgmTimer = null;
let bgmMuted = false;
let lastTrackId = -1;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = bgmMuted ? 0 : 0.30;
    masterGain.connect(audioCtx.destination);
  } catch (e) {}
}

function bgmPlayNote(freq, dur, vol, when, tone) {
  if (!audioCtx || freq <= 0) return;
  const osc = audioCtx.createOscillator();
  osc.type = tone;
  osc.frequency.value = freq;
  const g = audioCtx.createGain();
  const att = Math.min(0.05, dur * 0.15);
  const rel = Math.min(0.4, dur * 0.5);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(vol, when + att);
  g.gain.setValueAtTime(vol, when + Math.max(att, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(when);
  osc.stop(when + dur + 0.1);
}

let bgmEndAudioTime = 0;   // 現在の曲が鳴り終わる AudioContext 時刻
let bgmRequested = false;  // ワールド生成完了 + 15秒経過で true
let worldReadyAt = 0;

function scheduleTrack(track) {
  if (!audioCtx) return 0;
  const start = audioCtx.currentTime + 0.15;
  let cursor = start;
  const tone = track.tone || 'sine';
  const vol = track.vol || 0.22;
  for (const [note, dur] of track.melody) {
    const f = NOTE[note] || 0;
    if (f > 0) {
      bgmPlayNote(f, dur, vol, cursor, tone);
      if (track.harmony) {
        const hf = f * Math.pow(2, track.harmony / 12);
        bgmPlayNote(hf, dur, vol * 0.55, cursor, tone);
      }
    }
    cursor += dur;
  }
  const melodyEnd = cursor;
  let bassEnd = start;
  if (track.bass) {
    let bt = start;
    let bi = 0;
    const total = melodyEnd - start;
    while (bt < start + total - track.bass.dur * 0.5) {
      const bf = NOTE[track.bass.notes[bi % track.bass.notes.length]] || 0;
      if (bf > 0) bgmPlayNote(bf, track.bass.dur, track.bass.vol || 0.15, bt, 'triangle');
      bassEnd = bt + track.bass.dur;
      bt += track.bass.dur;
      bi++;
    }
  }
  return Math.max(melodyEnd, bassEnd) - start;
}

function playNextBGM() {
  if (!bgmPlaying || !audioCtx) return;
  // 前の曲がまだ鳴っている間は絶対に重ねない
  if (audioCtx.currentTime < bgmEndAudioTime) {
    const wait = (bgmEndAudioTime - audioCtx.currentTime + 0.2) * 1000;
    if (bgmTimer) clearTimeout(bgmTimer);
    bgmTimer = setTimeout(playNextBGM, wait);
    return;
  }
  let next;
  do { next = (Math.random() * BGM_TRACKS.length) | 0; }
  while (BGM_TRACKS.length > 1 && next === lastTrackId);
  lastTrackId = next;
  const duration = scheduleTrack(BGM_TRACKS[next]);
  bgmEndAudioTime = audioCtx.currentTime + duration + 0.3; // 余裕を持たせる
  const gap = 12 + Math.random() * 18; // 12〜30 秒の静寂
  if (bgmTimer) clearTimeout(bgmTimer);
  bgmTimer = setTimeout(playNextBGM, (duration + gap) * 1000);
}

function tryStartBGM() {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!bgmRequested) return;       // 15 秒経過まで開始しない
  if (bgmPlaying) return;
  bgmPlaying = true;
  // ワールドロード完了から 15 秒以上経っているか確認
  const elapsed = performance.now() - worldReadyAt;
  const delay = Math.max(0, 15000 - elapsed);
  if (bgmTimer) clearTimeout(bgmTimer);
  bgmTimer = setTimeout(playNextBGM, delay);
}

addEventListener('keydown', e => {
  if (e.code === 'KeyN' && !e.repeat) {
    if (settingsOpen) closeSettings(); else openSettings();
  }
});

const bgmSlider = document.getElementById('bgmSlider');
const volumeLabel = document.getElementById('volumeLabel');
bgmSlider.addEventListener('input', e => {
  const v = parseInt(e.target.value, 10);
  volumeLabel.textContent = v;
  bgmVolume = (v / 100) * 0.6;
  if (!audioCtx) initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  applyBgmVolume();
});
// 初期反映
bgmVolume = 0.30;

const fogSelect = document.getElementById('fogSelect');
fogSelect.addEventListener('change', e => {
  const v = e.target.value;
  const baseFar = VIEW_DIST * CHUNK_SIZE - 4;
  if (v === 'off') scene.fog = null;
  else if (v === 'weak')   scene.fog = new THREE.Fog(0x88ccee, baseFar - 16, baseFar + 20);
  else if (v === 'normal') scene.fog = new THREE.Fog(0x88ccee, 48, baseFar);
  else if (v === 'strong') scene.fog = new THREE.Fog(0x88ccee, 18, baseFar - 30);
});
const cloudSelect = document.getElementById('cloudSelect');
cloudSelect.addEventListener('change', e => { cloudsVisible = e.target.value === 'show'; });
const crosshairSelect = document.getElementById('crosshairSelect');
const crosshairEl = document.getElementById('crosshair');
crosshairSelect.addEventListener('change', e => {
  crosshairEl.style.display = e.target.value === 'show' ? 'block' : 'none';
});

// --- 起動 ---
let worldReady = false;

function startWorldGen() {
  loadingText.textContent = 'ワールド生成中...';
  setTimeout(() => {
    chooseSpawn();
    progressBar.style.width = '20%';
    setTimeout(() => {
      placeVillages();
      clearSpawnArea();
      progressBar.style.width = '50%';
      setTimeout(() => {
        spawnEntities();
        progressBar.style.width = '70%';
        setTimeout(() => {
          updateChunkStreaming();
          progressBar.style.width = '85%';
          setTimeout(() => {
            const initStart = performance.now();
            while (loadQueue.length > 0 && performance.now() - initStart < 2000) {
              processLoadQueue(50);
            }
            progressBar.style.width = '100%';
            worldReady = true;
            worldReadyAt = performance.now();
            // 15 秒後に BGM をリクエスト
            setTimeout(() => { bgmRequested = true; tryStartBGM(); }, 15000);
            if (isTouch) {
              blocker.style.display = 'none';
              touchUI.classList.add('active');
              pointerLocked = true;
            } else {
              loadingText.textContent = 'クリックして開始';
            }
          }, 30);
        }, 30);
      }, 30);
    }, 30);
  }, 30);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (worldReady) {
    processLoadQueue(6);
    rebuildDirtyChunks(2);
    if (pointerLocked && !settingsOpen) {
      updateClouds(dt);
      updatePlayer(dt);
      updateEntities(dt);
      updateDoors();
      updateFluids(dt);
      updateFire(dt);
      updateExplosionVisuals(dt);
      updateChunkStreaming();
      updateCoords();
    }
  }
  renderer.render(scene, camera);
}

startWorldGen();
animate();
</script>
</body>
