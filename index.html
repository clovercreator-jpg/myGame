<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minecraft風ゲーム</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; font-family: monospace; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #coords {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.55);
    padding: 6px 10px; border-radius: 4px;
    font-size: 13px; font-family: monospace;
    pointer-events: none; z-index: 5; white-space: pre;
  }
  #info {
    position: absolute; top: 50px; left: 10px;
    color: white; background: rgba(0,0,0,0.45);
    padding: 6px 10px; border-radius: 4px;
    font-size: 11px; line-height: 1.5;
    pointer-events: none; z-index: 5;
    max-width: calc(100vw - 30px);
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 20px; height: 20px; margin: -10px 0 0 -10px;
    pointer-events: none; z-index: 5;
  }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; box-shadow: 0 0 2px black; }
  #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
  #crosshair::after  { left: 9px; top: 0; width: 2px; height: 20px; }
  #blocker {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; z-index: 10; text-align: center;
    padding: 20px; box-sizing: border-box;
  }
  #blocker h1 { font-size: 28px; margin: 0 0 16px; }
  #blocker p  { font-size: 14px; margin: 4px 0; }
  #progress { width: 240px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin: 8px 0; overflow: hidden; }
  #progressBar { height: 100%; width: 0%; background: #6cf; transition: width 0.2s; }
  #hotbar {
    position: absolute; bottom: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px;
    background: rgba(0,0,0,0.45); border-radius: 6px; z-index: 5;
  }
  .slot {
    width: 46px; height: 46px;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 4px;
    background-size: cover; image-rendering: pixelated;
    position: relative; cursor: pointer;
    pointer-events: auto; touch-action: manipulation;
  }
  .slot.selected { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
  .slot::after {
    content: attr(data-num); position: absolute;
    top: 1px; left: 3px; color: white; font-size: 11px;
    text-shadow: 1px 1px 0 black, -1px -1px 0 black, 1px -1px 0 black, -1px 1px 0 black;
  }
  #touchUI { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #touchUI.active { display: block; }
  #joystick {
    position: absolute; bottom: max(80px, env(safe-area-inset-bottom, 0px)); left: 24px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
    pointer-events: auto; touch-action: none;
  }
  #joyKnob {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.8); pointer-events: none;
    transition: transform 0.05s linear;
  }
  .actBtn {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
    color: white; font-size: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
  }
  .actBtn.pressed { background: rgba(255,255,255,0.4); }
  #jumpBtn  { right: 28px;  bottom: max(80px, env(safe-area-inset-bottom, 0px));  width: 80px; height: 80px; }
  #breakBtn { right: 122px; bottom: max(85px, env(safe-area-inset-bottom, 0px));  width: 64px; height: 64px; background: rgba(220,80,80,0.35); border-color: rgba(255,140,140,0.7); }
  #placeBtn { right: 28px;  bottom: max(170px, env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; background: rgba(80,170,220,0.35); border-color: rgba(140,200,255,0.7); }
  #damageOverlay {
    position: absolute; inset: 0; background: red; opacity: 0;
    pointer-events: none; z-index: 4; transition: opacity 0.5s;
  }
</style>
</head>
<body>
<div id="damageOverlay"></div>
<div id="coords">XYZ: -- / -- / --</div>
<div id="info">WASD: 移動 / Space: ジャンプ / 左クリック: 壊す / 右クリック: 置く / 1-7: 選択</div>
<div id="crosshair"></div>
<div id="blocker">
  <h1>Minecraft風ゲーム</h1>
  <p id="loadingText">ワールド生成中...</p>
  <div id="progress"><div id="progressBar"></div></div>
  <p>WASD: 移動 / Space: ジャンプ / マウス: 視点 / ESC: 終了</p>
  <p>左クリック: 壊す / 右クリック: 置く / 1-7: ブロック選択</p>
  <p style="color:#f88">⚠ 緑のクリーパーに近付くと爆発します</p>
</div>
<div id="hotbar">
  <div class="slot selected" data-block="1" data-num="1"></div>
  <div class="slot"          data-block="2" data-num="2"></div>
  <div class="slot"          data-block="7" data-num="3"></div>
  <div class="slot"          data-block="6" data-num="4"></div>
  <div class="slot"          data-block="4" data-num="5"></div>
  <div class="slot"          data-block="5" data-num="6"></div>
  <div class="slot"          data-block="8" data-num="7"></div>
</div>
<div id="touchUI">
  <div id="joystick"><div id="joyKnob"></div></div>
  <div id="jumpBtn"  class="actBtn">JUMP</div>
  <div id="breakBtn" class="actBtn">壊す</div>
  <div id="placeBtn" class="actBtn">置く</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }

<script type="module">
import * as THREE from 'three';

const WORLD_SIZE = 768;
const WORLD_HEIGHT = 96;
const CHUNK_SIZE = 16;
const CHUNKS_PER_SIDE = WORLD_SIZE / CHUNK_SIZE;
const VIEW_DIST = 6;
const REACH = 6;

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88ccee);
scene.fog = new THREE.Fog(0x88ccee, 60, VIEW_DIST * CHUNK_SIZE - 8);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 500);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = false; // 影は重いので無効化
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(50, 100, 30);
scene.add(sun);

// --- Noise ---
function makeHash(seed) {
  return (x, y) => {
    let h = (x * 374761393 + y * 668265263 + seed) | 0;
    h = ((h ^ (h >> 13)) * 1274126177) | 0;
    h = h ^ (h >> 16);
    return (h % 1000000) / 500000 - 1; // -1..1
  };
}
function smoothNoise(hash, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi);
  const b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1);
  const d = hash(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(hash, x, y, octaves = 4, persistence = 0.5) {
  let total = 0, amp = 1, freq = 1, max = 0;
  for (let i = 0; i < octaves; i++) {
    total += smoothNoise(hash, x * freq, y * freq) * amp;
    max += amp;
    amp *= persistence;
    freq *= 2;
  }
  return total / max;
}

const heightHash = makeHash(13371);
const mountainHash = makeHash(80085);
const biomeHash = makeHash(42424);
const lakeHash = makeHash(33333);

// 3D ノイズ (洞窟用)
function makeHash3D(seed) {
  return (x, y, z) => {
    let h = (x * 374761393 + y * 668265263 + z * 1597334677 + seed) | 0;
    h = ((h ^ (h >> 13)) * 1274126177) | 0;
    h = ((h ^ (h >> 16)) * 1597334677) | 0;
    return ((h | 0) % 1000000) / 500000 - 1;
  };
}
function smoothNoise3D(hash, x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const c000 = hash(xi,   yi,   zi  );
  const c100 = hash(xi+1, yi,   zi  );
  const c010 = hash(xi,   yi+1, zi  );
  const c110 = hash(xi+1, yi+1, zi  );
  const c001 = hash(xi,   yi,   zi+1);
  const c101 = hash(xi+1, yi,   zi+1);
  const c011 = hash(xi,   yi+1, zi+1);
  const c111 = hash(xi+1, yi+1, zi+1);
  const L = (a, b, t) => a + t * (b - a);
  return L(L(L(c000, c100, u), L(c010, c110, u), v),
           L(L(c001, c101, u), L(c011, c111, u), v), w);
}
const caveHash1 = makeHash3D(7777);
const caveHash2 = makeHash3D(8888);
const stoneHash = makeHash3D(33337);
const entranceHash = makeHash3D(54321);
function isCave(x, y, z) {
  // 低周波 + しきい値高めで広い洞窟空間
  const n1 = smoothNoise3D(caveHash1, x * 0.028, y * 0.055, z * 0.028);
  const n2 = smoothNoise3D(caveHash2, x * 0.024, y * 0.06,  z * 0.024);
  return Math.abs(n1) < 0.24 && Math.abs(n2) < 0.24;
}

const WATER_LEVEL = 25;

function terrainHeight(x, z) {
  const base = fbm(heightHash, x / 80, z / 80, 4);
  const lakeN = fbm(lakeHash, x / 130, z / 130, 2);
  const mtn = fbm(mountainHash, x / 220, z / 220, 3, 0.55);
  let h = 30 + base * 5;
  if (lakeN < -0.05) h -= (-lakeN + 0.05) * 18; // 湖の窪み
  if (mtn > 0.12) {
    const f = (mtn - 0.12) / 0.88;
    const detail = smoothNoise(mountainHash, x / 28, z / 28);
    h += Math.pow(f, 1.35) * 58 + f * detail * 6;
  }
  return Math.max(14, Math.min(WORLD_HEIGHT - 6, Math.round(h)));
}
function isForestAt(x, z) {
  return fbm(biomeHash, x / 110, z / 110, 2) > 0.18;
}

// --- Textures ---
const textureCanvases = {};
function makeTexture(name, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 16;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  textureCanvases[name] = c;
  return t;
}
const grassTopTex = makeTexture('grassTop', ctx => {
  ctx.fillStyle = '#5eaa3a'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 40; i++) { ctx.fillStyle = Math.random() < 0.5 ? '#4a8a2e' : '#76c44a';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1); }
});
const grassSideTex = makeTexture('grassSide', ctx => {
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 30; i++) { ctx.fillStyle = Math.random() < 0.5 ? '#6e4423' : '#a06d35';
    ctx.fillRect((Math.random()*16)|0, 4 + ((Math.random()*12)|0), 1, 1); }
  ctx.fillStyle = '#5eaa3a'; ctx.fillRect(0, 0, 16, 4);
  for (let i = 0; i < 18; i++) { ctx.fillStyle = Math.random() < 0.5 ? '#4a8a2e' : '#76c44a';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*4)|0, 1, 1); }
});
const dirtTex = makeTexture('dirt', ctx => {
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 50; i++) { ctx.fillStyle = Math.random() < 0.5 ? '#6e4423' : '#a06d35';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1); }
});
const cobbleTex = makeTexture('cobble', ctx => {
  ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 70; i++) { const v = 80 + ((Math.random()*60)|0);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1+((Math.random()*2)|0), 1+((Math.random()*2)|0)); }
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(0, 7, 16, 1); ctx.fillRect(7, 0, 1, 8);
  ctx.fillRect(3, 8, 1, 8);  ctx.fillRect(11, 8, 1, 8);
});
const bedrockTex = makeTexture('bedrock', ctx => {
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 90; i++) { const v = 30 + ((Math.random()*55)|0);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1+((Math.random()*2)|0), 1+((Math.random()*2)|0)); }
});
const logSideTex = makeTexture('logSide', ctx => {
  ctx.fillStyle = '#6b4a26'; ctx.fillRect(0, 0, 16, 16);
  for (let x = 0; x < 16; x++) if (Math.random() < 0.35) {
    ctx.fillStyle = Math.random() < 0.5 ? '#553a1d' : '#7d5a30';
    ctx.fillRect(x, 0, 1, 16);
  }
});
const logTopTex = makeTexture('logTop', ctx => {
  ctx.fillStyle = '#a07a45'; ctx.fillRect(0, 0, 16, 16);
  ctx.strokeStyle = '#553a1d'; ctx.lineWidth = 1;
  for (let r = 1; r <= 7; r += 2) ctx.strokeRect(8 - r - 0.5, 8 - r - 0.5, r * 2 + 1, r * 2 + 1);
  ctx.fillStyle = '#553a1d'; ctx.fillRect(7, 7, 2, 2);
});
const leavesTex = makeTexture('leaves', ctx => {
  ctx.fillStyle = '#3a7a2a'; ctx.fillRect(0, 0, 16, 16);
  const palette = ['#2d6020', '#46913a', '#549444', '#234a18', '#3a7a2a'];
  for (let i = 0; i < 90; i++) { ctx.fillStyle = palette[(Math.random() * palette.length) | 0];
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1); }
});
const snowTex = makeTexture('snow', ctx => {
  ctx.fillStyle = '#f5f6fa'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 25; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? '#e2e6ee' : '#ffffff';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1);
  }
});
const waterTex = makeTexture('water', ctx => {
  ctx.fillStyle = '#3a78b0'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? '#2c5d8a' : '#5494c8';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1);
  }
});
const stoneTex = makeTexture('stone', ctx => {
  ctx.fillStyle = '#919191'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 40; i++) {
    const v = 125 + ((Math.random() * 40) | 0);
    ctx.fillStyle = `rgb(${v},${v},${v})`;
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1);
  }
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = '#6e6e6e';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1);
  }
});
const lavaTex = makeTexture('lava', ctx => {
  ctx.fillStyle = '#d8500e'; ctx.fillRect(0, 0, 16, 16);
  for (let i = 0; i < 45; i++) {
    ctx.fillStyle = Math.random() < 0.5 ? '#f0a020' : '#a83b0a';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1 + ((Math.random()*2)|0), 1 + ((Math.random()*2)|0));
  }
  for (let i = 0; i < 12; i++) {
    ctx.fillStyle = '#ffd040';
    ctx.fillRect((Math.random()*16)|0, (Math.random()*16)|0, 1, 1);
  }
});

const grassMaterials = [
  new THREE.MeshLambertMaterial({ map: grassSideTex }),
  new THREE.MeshLambertMaterial({ map: grassSideTex }),
  new THREE.MeshLambertMaterial({ map: grassTopTex }),
  new THREE.MeshLambertMaterial({ map: dirtTex }),
  new THREE.MeshLambertMaterial({ map: grassSideTex }),
  new THREE.MeshLambertMaterial({ map: grassSideTex }),
];
const cobbleMaterial  = new THREE.MeshLambertMaterial({ map: cobbleTex });
const bedrockMaterial = new THREE.MeshLambertMaterial({ map: bedrockTex });
const dirtMaterial    = new THREE.MeshLambertMaterial({ map: dirtTex });
const logMaterials = [
  new THREE.MeshLambertMaterial({ map: logSideTex }),
  new THREE.MeshLambertMaterial({ map: logSideTex }),
  new THREE.MeshLambertMaterial({ map: logTopTex }),
  new THREE.MeshLambertMaterial({ map: logTopTex }),
  new THREE.MeshLambertMaterial({ map: logSideTex }),
  new THREE.MeshLambertMaterial({ map: logSideTex }),
];
const leavesMaterial = new THREE.MeshLambertMaterial({ map: leavesTex });
const snowMaterial   = new THREE.MeshLambertMaterial({ map: snowTex });
const stoneMaterial  = new THREE.MeshLambertMaterial({ map: stoneTex });
const lavaMaterial   = new THREE.MeshBasicMaterial({ map: lavaTex });
const waterMaterial  = new THREE.MeshLambertMaterial({
  map: waterTex, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false
});

// 0:air 1:grass 2:cobble 3:bedrock 4:log 5:leaves 6:dirt 7:stone 8:snow 9:water 10:lava
const BLOCK_TYPES = {
  1:  { material: grassMaterials,  icon: 'grassTop' },
  2:  { material: cobbleMaterial,  icon: 'cobble' },
  3:  { material: bedrockMaterial, icon: 'bedrock' },
  4:  { material: logMaterials,    icon: 'logSide' },
  5:  { material: leavesMaterial,  icon: 'leaves' },
  6:  { material: dirtMaterial,    icon: 'dirt' },
  7:  { material: stoneMaterial,   icon: 'stone' },
  8:  { material: snowMaterial,    icon: 'snow' },
  9:  { material: waterMaterial,   icon: 'water' },
  10: { material: lavaMaterial,    icon: 'lava' },
};

// --- World data ---
const world = new Uint8Array(WORLD_SIZE * WORLD_HEIGHT * WORLD_SIZE);
const idx = (x, y, z) => (y * WORLD_SIZE + z) * WORLD_SIZE + x;
function getBlock(x, y, z) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return 0;
  if (y < 0 || y >= WORLD_HEIGHT) return 0;
  return world[idx(x, y, z)];
}
function setWorld(x, y, z, v) { world[idx(x, y, z)] = v; }
function isAir(x, y, z) {
  if (y < 0) return false;
  if (y >= WORLD_HEIGHT) return true;
  if (x < 0 || x >= WORLD_SIZE) return false;
  if (z < 0 || z >= WORLD_SIZE) return false;
  return world[idx(x, y, z)] === 0;
}
// 衝突判定用: ワールドの外も「実体」扱い (透明壁の役目)。水と溶岩は通り抜け可能
function isSolidForCollision(x, y, z) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return true;
  if (y < 0) return true;
  if (y >= WORLD_HEIGHT) return false;
  const t = world[idx(x, y, z)];
  return t !== 0 && t !== 9 && t !== 10;
}

// --- 地形生成 ---
function generateTerrain() {
  for (let x = 0; x < WORLD_SIZE; x++) {
    for (let z = 0; z < WORLD_SIZE; z++) {
      const h = terrainHeight(x, z);
      const isMountain = h >= 48;
      const isSnowy = h >= 62;
      const isUnderwater = h < WATER_LEVEL;
      setWorld(x, 0, z, 3);
      for (let y = 1; y < h; y++) {
        // 洞窟: 表面から少し下、岩盤の少し上で発生
        if (y >= 4 && y < h - 2 && isCave(x, y, z)) continue;
        if (!isMountain && y >= h - 3) setWorld(x, y, z, 6); // dirt
        else {
          // 石ベース、丸石の斑を混ぜる
          const vein = smoothNoise3D(stoneHash, x * 0.22, y * 0.28, z * 0.22);
          setWorld(x, y, z, vein > 0.18 ? 2 : 7);
        }
      }
      let top;
      if (isSnowy) top = 8;
      else if (isMountain) top = 2;
      else if (isUnderwater) top = 6;
      else top = 1;
      setWorld(x, h, z, top);
      if (isUnderwater) {
        for (let y = h + 1; y <= WATER_LEVEL; y++) setWorld(x, y, z, 9);
      }
    }
  }
}

// 洞窟の床に溶岩を撒く (低層のみ)
function placeLava() {
  for (let x = 1; x < WORLD_SIZE - 1; x++) {
    for (let z = 1; z < WORLD_SIZE - 1; z++) {
      for (let y = 3; y < 14; y++) {
        if (world[idx(x, y, z)] !== 0) continue;
        const below = world[idx(x, y - 1, z)];
        if (below === 0 || below === 9 || below === 10) continue;
        if (Math.random() < 0.18) setWorld(x, y, z, 10);
      }
    }
  }
}

// --- 木 (森バイオームのみ) ---
function placeTree(tx, baseY, tz) {
  const trunkH = 4 + ((Math.random() * 2) | 0);
  for (let i = 0; i < trunkH; i++) {
    const y = baseY + i;
    if (y >= WORLD_HEIGHT) break;
    setWorld(tx, y, tz, 4);
  }
  const topY = baseY + trunkH;
  for (let dy = -2; dy <= -1; dy++)
    for (let dx = -2; dx <= 2; dx++)
      for (let dz = -2; dz <= 2; dz++) {
        const corner = Math.abs(dx) === 2 && Math.abs(dz) === 2;
        if (corner && Math.random() < 0.6) continue;
        const lx = tx + dx, ly = topY + dy, lz = tz + dz;
        if (lx < 1 || lx >= WORLD_SIZE - 1 || lz < 1 || lz >= WORLD_SIZE - 1) continue;
        if (ly < 0 || ly >= WORLD_HEIGHT) continue;
        if (getBlock(lx, ly, lz) === 0) setWorld(lx, ly, lz, 5);
      }
  for (let dy = 0; dy <= 1; dy++)
    for (let dx = -1; dx <= 1; dx++)
      for (let dz = -1; dz <= 1; dz++) {
        const corner = Math.abs(dx) === 1 && Math.abs(dz) === 1;
        if (corner && dy === 1 && Math.random() < 0.7) continue;
        const lx = tx + dx, ly = topY + dy, lz = tz + dz;
        if (lx < 1 || lx >= WORLD_SIZE - 1 || lz < 1 || lz >= WORLD_SIZE - 1) continue;
        if (ly < 0 || ly >= WORLD_HEIGHT) continue;
        if (getBlock(lx, ly, lz) === 0) setWorld(lx, ly, lz, 5);
      }
}

function placeTrees() {
  const TREE_CELL = 4;
  const gridW = Math.ceil(WORLD_SIZE / TREE_CELL);
  const treeGrid = new Uint8Array(gridW * gridW);
  const TARGET_TREES = 4000;
  let placed = 0;
  for (let attempt = 0; attempt < 60000 && placed < TARGET_TREES; attempt++) {
    const tx = 4 + ((Math.random() * (WORLD_SIZE - 8)) | 0);
    const tz = 4 + ((Math.random() * (WORLD_SIZE - 8)) | 0);
    if (!isForestAt(tx, tz)) continue;
    const h = terrainHeight(tx, tz);
    if (h >= 48) continue;
    if (h <= WATER_LEVEL) continue;                       // 湖や湖岸を避ける
    if (getBlock(tx, h, tz) !== 1) continue;              // 草地のみ (洞窟天井に注意)
    if (Math.abs(tx - SPAWN_X) < 6 && Math.abs(tz - SPAWN_Z) < 6) continue;
    const cx = (tx / TREE_CELL) | 0, cz = (tz / TREE_CELL) | 0;
    let tooClose = false;
    for (let dz = -1; dz <= 1 && !tooClose; dz++)
      for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, nz = cz + dz;
        if (nx >= 0 && nx < gridW && nz >= 0 && nz < gridW && treeGrid[nz * gridW + nx]) {
          tooClose = true; break;
        }
      }
    if (tooClose) continue;
    treeGrid[cz * gridW + cx] = 1;
    placeTree(tx, h + 1, tz);
    placed++;
  }
}

// --- チャンク ---
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const tmpMatrix = new THREE.Matrix4();

class Chunk {
  constructor(cx, cz) {
    this.cx = cx; this.cz = cz;
    this.meshes = {};
    this.built = false;
  }
  build() {
    this.dispose();
    const buckets = {};
    const minX = this.cx * CHUNK_SIZE;
    const minZ = this.cz * CHUNK_SIZE;
    for (let lx = 0; lx < CHUNK_SIZE; lx++) {
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const x = minX + lx;
        const z = minZ + lz;
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          const t = world[idx(x, y, z)];
          if (t === 0) continue;
          if (isAir(x+1,y,z) || isAir(x-1,y,z) || isAir(x,y+1,z) ||
              isAir(x,y-1,z) || isAir(x,y,z+1) || isAir(x,y,z-1)) {
            (buckets[t] = buckets[t] || []).push(x, y, z);
          }
        }
      }
    }
    for (const tid in buckets) {
      const positions = buckets[tid];
      const count = positions.length / 3;
      const mat = BLOCK_TYPES[+tid].material;
      const mesh = new THREE.InstancedMesh(blockGeo, mat, count);
      mesh.frustumCulled = true;
      for (let i = 0; i < count; i++) {
        tmpMatrix.makeTranslation(positions[i*3] + 0.5, positions[i*3+1] + 0.5, positions[i*3+2] + 0.5);
        mesh.setMatrixAt(i, tmpMatrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      this.meshes[tid] = mesh;
      scene.add(mesh);
    }
    this.built = true;
  }
  dispose() {
    for (const tid in this.meshes) {
      const m = this.meshes[tid];
      scene.remove(m);
      m.dispose();
    }
    this.meshes = {};
    this.built = false;
  }
}

const chunks = new Map();
const chunkKey = (cx, cz) => cx * 10000 + cz;
const loadQueue = [];
const dirtyChunks = new Set();

function requestChunkLoad(cx, cz) {
  if (cx < 0 || cx >= CHUNKS_PER_SIDE || cz < 0 || cz >= CHUNKS_PER_SIDE) return;
  const key = chunkKey(cx, cz);
  if (chunks.has(key)) return;
  loadQueue.push(key);
  chunks.set(key, null); // placeholder so we don't queue twice
}

function processLoadQueue(budgetMs) {
  const start = performance.now();
  while (loadQueue.length > 0 && performance.now() - start < budgetMs) {
    const key = loadQueue.shift();
    const cx = Math.floor(key / 10000);
    const cz = key - cx * 10000;
    const chunk = new Chunk(cx, cz);
    chunk.build();
    chunks.set(key, chunk);
  }
}

function rebuildDirtyChunks(budget) {
  let used = 0;
  for (const key of [...dirtyChunks]) {
    if (used >= budget) break;
    dirtyChunks.delete(key);
    const chunk = chunks.get(key);
    if (chunk && chunk.built) { chunk.build(); used++; }
  }
}

function markChunkDirty(x, z) {
  const cx = (x / CHUNK_SIZE) | 0;
  const cz = (z / CHUNK_SIZE) | 0;
  dirtyChunks.add(chunkKey(cx, cz));
}

function setBlock(x, y, z, type) {
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return;
  if (y < 0 || y >= WORLD_HEIGHT) return;
  if (world[idx(x, y, z)] === type) return;
  world[idx(x, y, z)] = type;
  markChunkDirty(x, z);
  // 隣接チャンクも更新が必要なケース (境界)
  const lx = x % CHUNK_SIZE, lz = z % CHUNK_SIZE;
  if (lx === 0) markChunkDirty(x - 1, z);
  if (lx === CHUNK_SIZE - 1) markChunkDirty(x + 1, z);
  if (lz === 0) markChunkDirty(x, z - 1);
  if (lz === CHUNK_SIZE - 1) markChunkDirty(x, z + 1);
}

function updateChunkStreaming() {
  const pcx = Math.floor(player.position.x / CHUNK_SIZE);
  const pcz = Math.floor(player.position.z / CHUNK_SIZE);
  const wanted = new Set();
  // 螺旋に近い順で読み込み
  const pending = [];
  for (let dz = -VIEW_DIST; dz <= VIEW_DIST; dz++)
    for (let dx = -VIEW_DIST; dx <= VIEW_DIST; dx++) {
      const cx = pcx + dx, cz = pcz + dz;
      if (cx < 0 || cx >= CHUNKS_PER_SIDE || cz < 0 || cz >= CHUNKS_PER_SIDE) continue;
      wanted.add(chunkKey(cx, cz));
      if (!chunks.has(chunkKey(cx, cz))) pending.push({ cx, cz, d: dx*dx + dz*dz });
    }
  pending.sort((a, b) => a.d - b.d);
  for (const p of pending) requestChunkLoad(p.cx, p.cz);
  // アンロード
  for (const [key, chunk] of chunks) {
    if (!wanted.has(key)) {
      if (chunk) chunk.dispose();
      chunks.delete(key);
    }
  }
}

// 自然な形の洞窟入り口
function carveNaturalEntrance(cx, cz, sh, caveY) {
  const baseRadius = 1.9 + Math.random() * 1.1; // 1.9..3.0
  for (let y = sh + 1; y >= caveY - 1; y--) {
    // 縦方向に蛇行
    const wobbleX = smoothNoise3D(entranceHash, cx * 0.3, y * 0.35, cz * 0.3) * 2.2;
    const wobbleZ = smoothNoise3D(entranceHash, cx * 0.3 + 313, y * 0.35, cz * 0.3 + 313) * 2.2;
    const centerX = cx + 0.5 + wobbleX;
    const centerZ = cz + 0.5 + wobbleZ;
    for (let dx = -5; dx <= 5; dx++) {
      for (let dz = -5; dz <= 5; dz++) {
        const tx = cx + dx, tz = cz + dz;
        if (tx < 1 || tx >= WORLD_SIZE - 1 || tz < 1 || tz >= WORLD_SIZE - 1) continue;
        if (y < 0 || y >= WORLD_HEIGHT) continue;
        const distX = (tx + 0.5) - centerX;
        const distZ = (tz + 0.5) - centerZ;
        const dist = Math.hypot(distX, distZ);
        // 縁を不規則に
        const edge = smoothNoise3D(entranceHash, tx * 0.55 + 700, y * 0.4, tz * 0.55 + 700);
        const radius = baseRadius + edge * 1.0;
        if (dist > radius) continue;
        const t = world[idx(tx, y, tz)];
        if (t === 9) continue; // 水は残す
        setWorld(tx, y, tz, 0);
      }
    }
  }
}

function placeCaveEntrances() {
  const TARGET = 180;
  let placed = 0;
  for (let attempt = 0; attempt < TARGET * 18 && placed < TARGET; attempt++) {
    const x = 10 + ((Math.random() * (WORLD_SIZE - 20)) | 0);
    const z = 10 + ((Math.random() * (WORLD_SIZE - 20)) | 0);
    if (Math.abs(x - SPAWN_X) < 16 && Math.abs(z - SPAWN_Z) < 16) continue;
    const sh = terrainHeight(x, z);
    if (sh <= WATER_LEVEL + 1) continue;
    if (sh >= 55) continue;
    // 直下に洞窟があるか
    let caveY = -1;
    for (let y = sh - 2; y >= 5; y--) {
      if (world[idx(x, y, z)] === 0) { caveY = y; break; }
    }
    if (caveY < 0 || sh - caveY > 22) continue;
    carveNaturalEntrance(x, z, sh, caveY);
    placed++;
  }
}

function clearSpawnArea() {
  let baseY = terrainHeight(SPAWN_X, SPAWN_Z);
  if (baseY < WATER_LEVEL + 2) baseY = WATER_LEVEL + 2;
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      const x = SPAWN_X + dx, z = SPAWN_Z + dz;
      setWorld(x, 0, z, 3);
      for (let y = 1; y <= baseY - 1; y++) {
        const t = world[idx(x, y, z)];
        if (t === 0 || t === 9) setWorld(x, y, z, 2);
      }
      setWorld(x, baseY, z, 1);
      for (let y = baseY + 1; y < WORLD_HEIGHT; y++) {
        const t = world[idx(x, y, z)];
        if (t === 9) setWorld(x, y, z, 0);
      }
    }
  }
  spawnFeetY = baseY + 1;
  player.position.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
}

// --- エンティティ (豚・クリーパー) ---
const pigBodyMat  = new THREE.MeshLambertMaterial({ color: 0xee9999 });
const pigSnoutMat = new THREE.MeshLambertMaterial({ color: 0xcc7777 });
const creeperBodyMat   = new THREE.MeshLambertMaterial({ color: 0x6dc956 });
const creeperFlashMat  = new THREE.MeshLambertMaterial({ color: 0xfff4c4 });
const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

class Entity {
  constructor(x, y, z) {
    this.group = new THREE.Group();
    this.group.position.set(x, y, z);
    this.velocity = new THREE.Vector3();
    this.dir = Math.random() * Math.PI * 2;
    this.timer = 1 + Math.random() * 3;
    this.legs = [];
    this.legTime = 0;
    this.dead = false;
    this.onGround = false;
    this.radius = 0.4;
    this.height = 1.0;
    scene.add(this.group);
  }
  applyGravity(dt) {
    this.velocity.y -= 28 * dt;
    const pos = this.group.position;
    const nx = pos.x + this.velocity.x * dt;
    if (!this.collidesAt(nx, pos.y, pos.z)) pos.x = nx; else this.velocity.x = 0;
    const nz = pos.z + this.velocity.z * dt;
    if (!this.collidesAt(pos.x, pos.y, nz)) pos.z = nz; else this.velocity.z = 0;
    const ny = pos.y + this.velocity.y * dt;
    if (!this.collidesAt(pos.x, ny, pos.z)) { pos.y = ny; this.onGround = false; }
    else {
      if (this.velocity.y < 0) this.onGround = true;
      this.velocity.y = 0;
    }
  }
  collidesAt(x, y, z) {
    const r = this.radius;
    const minX = Math.floor(x - r), maxX = Math.floor(x + r);
    const minZ = Math.floor(z - r), maxZ = Math.floor(z + r);
    const minY = Math.floor(y), maxY = Math.floor(y + this.height);
    for (let bx = minX; bx <= maxX; bx++)
      for (let by = minY; by <= maxY; by++)
        for (let bz = minZ; bz <= maxZ; bz++)
          if (isSolidForCollision(bx, by, bz)) return true;
    return false;
  }
  animateLegs(speed) {
    this.legTime += speed;
    if (this.legs.length < 4) return;
    const s = Math.sin(this.legTime) * 0.5;
    this.legs[0].rotation.x = s;
    this.legs[3].rotation.x = s;
    this.legs[1].rotation.x = -s;
    this.legs[2].rotation.x = -s;
  }
  restLegs() {
    for (const leg of this.legs) leg.rotation.x = 0;
  }
}

class Pig extends Entity {
  constructor(x, y, z) {
    super(x, y, z);
    this.radius = 0.45;
    this.height = 0.95;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 1.3), pigBodyMat);
    body.position.y = 0.55;
    this.group.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), pigBodyMat);
    head.position.set(0, 0.6, 0.95);
    this.group.add(head);
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.15), pigSnoutMat);
    snout.position.set(0, 0.5, 1.4);
    this.group.add(snout);
    const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.05);
    const eL = new THREE.Mesh(eyeGeo, blackMat); eL.position.set(-0.18, 0.78, 1.31); this.group.add(eL);
    const eR = new THREE.Mesh(eyeGeo, blackMat); eR.position.set(0.18, 0.78, 1.31); this.group.add(eR);
    const legGeo = new THREE.BoxGeometry(0.25, 0.4, 0.25);
    for (const [lx, lz] of [[-0.25, 0.45], [0.25, 0.45], [-0.25, -0.45], [0.25, -0.45]]) {
      const leg = new THREE.Mesh(legGeo, pigBodyMat);
      leg.position.set(lx, 0.2, lz);
      this.group.add(leg);
      this.legs.push(leg);
    }
  }
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.state = Math.random() < 0.5 ? 'idle' : 'wander';
      this.timer = 2 + Math.random() * 3;
      if (this.state === 'wander') this.dir = Math.random() * Math.PI * 2;
    }
    if (this.state === 'wander') {
      const speed = 1.3;
      this.velocity.x = Math.sin(this.dir) * speed;
      this.velocity.z = Math.cos(this.dir) * speed;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 7);
      // 段差ジャンプ
      if (this.onGround) {
        const fx = this.group.position.x + Math.sin(this.dir) * 0.6;
        const fz = this.group.position.z + Math.cos(this.dir) * 0.6;
        if (this.collidesAt(fx, this.group.position.y, fz) &&
            !this.collidesAt(fx, this.group.position.y + 1, fz)) {
          this.velocity.y = 6.5;
        }
      }
    } else {
      this.velocity.x = 0; this.velocity.z = 0;
      this.restLegs();
    }
    this.applyGravity(dt);
  }
}

class Creeper extends Entity {
  constructor(x, y, z) {
    super(x, y, z);
    this.radius = 0.32;
    this.height = 2.0;
    this.body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.1, 0.4), creeperBodyMat);
    this.body.position.y = 0.95;
    this.group.add(this.body);
    this.head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), creeperBodyMat);
    this.head.position.y = 1.77;
    this.group.add(this.head);
    // 顔
    const eyeGeo = new THREE.BoxGeometry(0.13, 0.13, 0.01);
    const eL = new THREE.Mesh(eyeGeo, blackMat); eL.position.set(-0.13, 1.85, 0.28); this.head.add(eL);
    const eR = new THREE.Mesh(eyeGeo, blackMat); eR.position.set( 0.13, 1.85, 0.28); this.head.add(eR);
    // mouth: simple frown
    const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.01), blackMat); m1.position.set(0, 1.66, 0.28); this.head.add(m1);
    const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.01), blackMat); m2.position.set(0, 1.74, 0.28); this.head.add(m2);
    // 4本足
    const legGeo = new THREE.BoxGeometry(0.18, 0.4, 0.25);
    for (const [lx, lz] of [[-0.13, 0.13], [0.13, 0.13], [-0.13, -0.13], [0.13, -0.13]]) {
      const leg = new THREE.Mesh(legGeo, creeperBodyMat);
      leg.position.set(lx, 0.2, lz);
      this.group.add(leg);
      this.legs.push(leg);
    }
    this.state = 'roam';
    this.fuse = 0;
    this.exploded = false;
  }
  setFlash(on) {
    const mat = on ? creeperFlashMat : creeperBodyMat;
    this.body.material = mat;
    this.head.material = mat;
    for (const leg of this.legs) leg.material = mat;
  }
  update(dt) {
    if (this.exploded) return;
    const pos = this.group.position;
    const dx = player.position.x - pos.x;
    const dy = (player.position.y - EYE_HEIGHT) - pos.y;
    const dz = player.position.z - pos.z;
    const dist = Math.hypot(dx, dz);

    if (dist < 1.6 && Math.abs(dy) < 2.2) {
      // 起爆: 接触
      this.detonate();
      return;
    }

    if (dist < 16) {
      // プレイヤーを追う
      this.dir = Math.atan2(dx, dz);
      const speed = 2.0;
      this.velocity.x = Math.sin(this.dir) * speed;
      this.velocity.z = Math.cos(this.dir) * speed;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 9);
      if (this.onGround) {
        const fx = pos.x + Math.sin(this.dir) * 0.5;
        const fz = pos.z + Math.cos(this.dir) * 0.5;
        if (this.collidesAt(fx, pos.y, fz) && !this.collidesAt(fx, pos.y + 1, fz)) {
          this.velocity.y = 7;
        }
      }
    } else {
      // ぶらつき
      this.timer -= dt;
      if (this.timer <= 0) {
        this.dir = Math.random() * Math.PI * 2;
        this.timer = 2 + Math.random() * 3;
      }
      const speed = 0.8;
      this.velocity.x = Math.sin(this.dir) * speed;
      this.velocity.z = Math.cos(this.dir) * speed;
      this.group.rotation.y = this.dir;
      this.animateLegs(dt * 5);
    }
    this.applyGravity(dt);
  }
  detonate() {
    if (this.exploded) return;
    this.exploded = true;
    this.dead = true;
    explode(this.group.position.x, this.group.position.y + 0.5, this.group.position.z);
  }
}

const entities = [];

function spawnEntities() {
  // 豚 (森限定)
  let pigCount = 0;
  for (let attempt = 0; attempt < 2500 && pigCount < 40; attempt++) {
    const x = 4 + Math.random() * (WORLD_SIZE - 8);
    const z = 4 + Math.random() * (WORLD_SIZE - 8);
    if (!isForestAt(x, z)) continue;
    const ix = x | 0, iz = z | 0;
    const h = terrainHeight(ix, iz);
    if (h >= 48) continue;
    if (h <= WATER_LEVEL) continue;
    if (getBlock(ix, h, iz) !== 1) continue;
    if (Math.abs(x - SPAWN_X) < 20 && Math.abs(z - SPAWN_Z) < 20) continue;
    entities.push(new Pig(x, h + 1, z));
    pigCount++;
  }
  // クリーパー (洞窟限定)
  let creeperCount = 0;
  for (let attempt = 0; attempt < 8000 && creeperCount < 35; attempt++) {
    const cx = 10 + ((Math.random() * (WORLD_SIZE - 20)) | 0);
    const cz = 10 + ((Math.random() * (WORLD_SIZE - 20)) | 0);
    const sh = terrainHeight(cx, cz);
    if (Math.abs(cx - SPAWN_X) < 28 && Math.abs(cz - SPAWN_Z) < 28) continue;
    // 洞窟内の足場を探す: 空気 2 ブロック + 下が固体
    for (let tries = 0; tries < 6; tries++) {
      const cy = 5 + ((Math.random() * Math.max(1, sh - 8)) | 0);
      if (cy < 5 || cy >= sh - 2) continue;
      if (world[idx(cx, cy, cz)] !== 0) continue;
      if (world[idx(cx, cy + 1, cz)] !== 0) continue;
      const below = world[idx(cx, cy - 1, cz)];
      if (below === 0 || below === 9) continue;
      entities.push(new Creeper(cx + 0.5, cy, cz + 0.5));
      creeperCount++;
      break;
    }
  }
}

// --- 爆発 ---
const explosionVisuals = [];
const damageOverlayEl = document.getElementById('damageOverlay');

function explode(x, y, z) {
  const R = 4;
  for (let dx = -R; dx <= R; dx++) {
    for (let dy = -R; dy <= R; dy++) {
      for (let dz = -R; dz <= R; dz++) {
        const d = Math.hypot(dx, dy, dz);
        if (d > R) continue;
        const bx = Math.floor(x + dx), by = Math.floor(y + dy), bz = Math.floor(z + dz);
        const t = getBlock(bx, by, bz);
        if (t === 0 || t === 3 || t === 9 || t === 10) continue; // 岩盤・水・溶岩は壊れない
        if (Math.random() < 1 - d / R - 0.1) setBlock(bx, by, bz, 0);
      }
    }
  }
  // プレイヤー被害
  const dx2 = player.position.x - x;
  const dy2 = (player.position.y - EYE_HEIGHT) - y;
  const dz2 = player.position.z - z;
  const pd = Math.hypot(dx2, dy2, dz2);
  if (pd < R + 2) {
    // ノックバック + リスポーン
    damageOverlayEl.style.opacity = '0.6';
    setTimeout(() => damageOverlayEl.style.opacity = '0', 30);
    if (pd < R) {
      player.position.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
      velocity.set(0, 0, 0);
    } else {
      const k = (R + 2 - pd) * 3;
      velocity.x = (dx2 / pd) * k;
      velocity.z = (dz2 / pd) * k;
      velocity.y = Math.max(velocity.y, 6);
    }
  }
  // ビジュアル
  const geo = new THREE.SphereGeometry(0.5, 10, 10);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  explosionVisuals.push({ mesh, life: 0.6, total: 0.6 });
}

function updateExplosionVisuals(dt) {
  for (let i = explosionVisuals.length - 1; i >= 0; i--) {
    const e = explosionVisuals[i];
    e.life -= dt;
    if (e.life <= 0) {
      scene.remove(e.mesh);
      e.mesh.geometry.dispose();
      e.mesh.material.dispose();
      explosionVisuals.splice(i, 1);
    } else {
      const t = 1 - e.life / e.total;
      e.mesh.scale.setScalar(0.5 + t * 8);
      e.mesh.material.opacity = 0.8 * (1 - t);
    }
  }
}

// --- 入力 ---
const keys = { forward: false, back: false, left: false, right: false, jump: false };
const joyVec = { x: 0, y: 0 };
const blocker = document.getElementById('blocker');
const loadingText = document.getElementById('loadingText');
const progressBar = document.getElementById('progressBar');
const infoEl = document.getElementById('info');
const coordsEl = document.getElementById('coords');
const touchUI = document.getElementById('touchUI');
let pointerLocked = false;

if (!isTouch) {
  blocker.addEventListener('click', () => { if (worldReady) document.body.requestPointerLock(); });
  document.addEventListener('pointerlockchange', () => {
    pointerLocked = document.pointerLockElement === document.body;
    blocker.style.display = pointerLocked ? 'none' : 'flex';
  });
  document.addEventListener('mousemove', e => {
    if (!pointerLocked) return;
    applyLook(e.movementX * 0.002, e.movementY * 0.002);
  });
  document.addEventListener('mousedown', e => {
    if (!pointerLocked) return;
    if (e.button === 0) tryBreak();
    else if (e.button === 2) tryPlace();
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    switch (e.code) {
      case 'KeyW': case 'ArrowUp':    keys.forward = true; break;
      case 'KeyS': case 'ArrowDown':  keys.back    = true; break;
      case 'KeyA': case 'ArrowLeft':  keys.left    = true; break;
      case 'KeyD': case 'ArrowRight': keys.right   = true; break;
      case 'Space':                   keys.jump    = true; break;
      case 'Digit1': selectBlock(1); break;
      case 'Digit2': selectBlock(2); break;
      case 'Digit3': selectBlock(7); break;
      case 'Digit4': selectBlock(6); break;
      case 'Digit5': selectBlock(4); break;
      case 'Digit6': selectBlock(5); break;
      case 'Digit7': selectBlock(8); break;
    }
  });
  addEventListener('keyup', e => {
    switch (e.code) {
      case 'KeyW': case 'ArrowUp':    keys.forward = false; break;
      case 'KeyS': case 'ArrowDown':  keys.back    = false; break;
      case 'KeyA': case 'ArrowLeft':  keys.left    = false; break;
      case 'KeyD': case 'ArrowRight': keys.right   = false; break;
      case 'Space':                   keys.jump    = false; break;
    }
  });
}

if (isTouch) {
  infoEl.textContent = 'スティック: 移動 / 画面: 視点 / JUMP: ジャンプ / 壊す・置く: ボタン';
  const joystickEl = document.getElementById('joystick');
  const joyKnobEl = document.getElementById('joyKnob');
  const jumpBtnEl = document.getElementById('jumpBtn');
  const breakBtnEl = document.getElementById('breakBtn');
  const placeBtnEl = document.getElementById('placeBtn');
  let joyTouchId = null, jumpTouchId = null, lookTouchId = null;
  let lookLastX = 0, lookLastY = 0;

  function updateJoystick(touch) {
    const rect = joystickEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = touch.clientX - cx, dy = touch.clientY - cy;
    const max = rect.width / 2;
    const dist = Math.hypot(dx, dy);
    if (dist > max) { dx = dx * max / dist; dy = dy * max / dist; }
    joyVec.x = dx / max; joyVec.y = dy / max;
    joyKnobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function resetJoystick() { joyVec.x = 0; joyVec.y = 0; joyKnobEl.style.transform = 'translate(0,0)'; }

  joystickEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (joyTouchId !== null) return;
    const t = e.changedTouches[0];
    joyTouchId = t.identifier; updateJoystick(t);
  }, { passive: false });
  jumpBtnEl.addEventListener('touchstart', e => {
    e.preventDefault();
    if (jumpTouchId !== null) return;
    jumpTouchId = e.changedTouches[0].identifier;
    keys.jump = true; jumpBtnEl.classList.add('pressed');
  }, { passive: false });
  breakBtnEl.addEventListener('touchstart', e => { e.preventDefault(); breakBtnEl.classList.add('pressed'); tryBreak(); }, { passive: false });
  breakBtnEl.addEventListener('touchend', () => breakBtnEl.classList.remove('pressed'));
  placeBtnEl.addEventListener('touchstart', e => { e.preventDefault(); placeBtnEl.classList.add('pressed'); tryPlace(); }, { passive: false });
  placeBtnEl.addEventListener('touchend', () => placeBtnEl.classList.remove('pressed'));

  document.addEventListener('touchstart', e => {
    if (lookTouchId !== null) return;
    for (const t of e.changedTouches) {
      const target = t.target;
      if (target.closest('#joystick') || target.closest('#jumpBtn') ||
          target.closest('#breakBtn') || target.closest('#placeBtn') ||
          target.closest('#hotbar') || target.closest('#blocker')) continue;
      lookTouchId = t.identifier; lookLastX = t.clientX; lookLastY = t.clientY; break;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) updateJoystick(t);
      else if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookLastX, dy = t.clientY - lookLastY;
        lookLastX = t.clientX; lookLastY = t.clientY;
        applyLook(dx * 0.005, dy * 0.005);
      }
    }
  }, { passive: true });
  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (t.identifier === joyTouchId) { joyTouchId = null; resetJoystick(); }
      else if (t.identifier === jumpTouchId) { jumpTouchId = null; keys.jump = false; jumpBtnEl.classList.remove('pressed'); }
      else if (t.identifier === lookTouchId) lookTouchId = null;
    }
  }
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- レイキャスト ---
const _origin = new THREE.Vector3();
const _dir = new THREE.Vector3();
function raycastBlock() {
  camera.getWorldPosition(_origin);
  camera.getWorldDirection(_dir);
  let x = Math.floor(_origin.x), y = Math.floor(_origin.y), z = Math.floor(_origin.z);
  const stepX = _dir.x > 0 ? 1 : (_dir.x < 0 ? -1 : 0);
  const stepY = _dir.y > 0 ? 1 : (_dir.y < 0 ? -1 : 0);
  const stepZ = _dir.z > 0 ? 1 : (_dir.z < 0 ? -1 : 0);
  const tDeltaX = stepX === 0 ? Infinity : Math.abs(1 / _dir.x);
  const tDeltaY = stepY === 0 ? Infinity : Math.abs(1 / _dir.y);
  const tDeltaZ = stepZ === 0 ? Infinity : Math.abs(1 / _dir.z);
  let tMaxX = stepX === 0 ? Infinity : (stepX > 0 ? (Math.floor(_origin.x) + 1 - _origin.x) : (_origin.x - Math.floor(_origin.x))) / Math.abs(_dir.x);
  let tMaxY = stepY === 0 ? Infinity : (stepY > 0 ? (Math.floor(_origin.y) + 1 - _origin.y) : (_origin.y - Math.floor(_origin.y))) / Math.abs(_dir.y);
  let tMaxZ = stepZ === 0 ? Infinity : (stepZ > 0 ? (Math.floor(_origin.z) + 1 - _origin.z) : (_origin.z - Math.floor(_origin.z))) / Math.abs(_dir.z);
  let lastAxis = -1, lastSign = 0, t = 0;
  while (t < REACH) {
    if (getBlock(x, y, z) !== 0) {
      let px = x, py = y, pz = z;
      if (lastAxis === 0) px -= lastSign;
      else if (lastAxis === 1) py -= lastSign;
      else if (lastAxis === 2) pz -= lastSign;
      return { x, y, z, placeX: px, placeY: py, placeZ: pz };
    }
    if (tMaxX < tMaxY && tMaxX < tMaxZ) { x += stepX; t = tMaxX; tMaxX += tDeltaX; lastAxis = 0; lastSign = stepX; }
    else if (tMaxY < tMaxZ) { y += stepY; t = tMaxY; tMaxY += tDeltaY; lastAxis = 1; lastSign = stepY; }
    else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; lastAxis = 2; lastSign = stepZ; }
  }
  return null;
}

function intersectsPlayer(bx, by, bz) {
  const pos = player.position;
  const minX = pos.x - PLAYER_RADIUS, maxX = pos.x + PLAYER_RADIUS;
  const minZ = pos.z - PLAYER_RADIUS, maxZ = pos.z + PLAYER_RADIUS;
  const feetY = pos.y - EYE_HEIGHT, headY = feetY + PLAYER_HEIGHT;
  return (maxX > bx && minX < bx + 1 && maxZ > bz && minZ < bz + 1 && headY > by && feetY < by + 1);
}

function tryBreak() {
  const tgt = raycastBlock();
  if (!tgt) return;
  const t = getBlock(tgt.x, tgt.y, tgt.z);
  if (t === 0 || t === 3 || t === 9 || t === 10) return; // 岩盤・水・溶岩は壊せない
  setBlock(tgt.x, tgt.y, tgt.z, 0);
}
function tryPlace() {
  const tgt = raycastBlock();
  if (!tgt) return;
  const { placeX: x, placeY: y, placeZ: z } = tgt;
  if (x < 0 || x >= WORLD_SIZE || z < 0 || z >= WORLD_SIZE) return;
  if (y < 0 || y >= WORLD_HEIGHT) return;
  if (getBlock(x, y, z) !== 0) return;
  if (intersectsPlayer(x, y, z)) return;
  setBlock(x, y, z, selectedBlock);
}

// --- プレイヤー物理 ---
const GRAVITY = 28;
const JUMP_SPEED = 9;
const MOVE_SPEED = 5;
const velocity = new THREE.Vector3();
const moveDir = new THREE.Vector3();
let onGround = false;
function playerTouchesBlock(targetType) {
  const pos = player.position;
  const minX = Math.floor(pos.x - PLAYER_RADIUS), maxX = Math.floor(pos.x + PLAYER_RADIUS);
  const minZ = Math.floor(pos.z - PLAYER_RADIUS), maxZ = Math.floor(pos.z + PLAYER_RADIUS);
  const feetY = pos.y - EYE_HEIGHT;
  const headY = feetY + PLAYER_HEIGHT;
  const minY = Math.floor(feetY), maxY = Math.floor(headY);
  for (let x = minX; x <= maxX; x++)
    for (let y = minY; y <= maxY; y++)
      for (let z = minZ; z <= maxZ; z++)
        if (getBlock(x, y, z) === targetType) return true;
  return false;
}

const LAVA_DEATH_AT = 1.5;
let lavaTimer = 0;

function playerCollides(px, py, pz) {
  const minX = Math.floor(px - PLAYER_RADIUS), maxX = Math.floor(px + PLAYER_RADIUS);
  const minZ = Math.floor(pz - PLAYER_RADIUS), maxZ = Math.floor(pz + PLAYER_RADIUS);
  const feetY = py - EYE_HEIGHT, headY = feetY + PLAYER_HEIGHT;
  const minY = Math.floor(feetY), maxY = Math.floor(headY);
  for (let x = minX; x <= maxX; x++)
    for (let y = minY; y <= maxY; y++)
      for (let z = minZ; z <= maxZ; z++)
        if (isSolidForCollision(x, y, z)) return true;
  return false;
}

const clock = new THREE.Clock();

function updateCoords() {
  const pos = player.position;
  coordsEl.textContent = `XYZ: ${pos.x.toFixed(1)} / ${(pos.y - EYE_HEIGHT).toFixed(1)} / ${pos.z.toFixed(1)}\nチャンク: ${(loadQueue.length)} 読込中`;
}

function updatePlayer(dt) {
  // 横移動の摩擦 (ノックバック減衰)
  velocity.x *= Math.max(0, 1 - 5 * dt);
  velocity.z *= Math.max(0, 1 - 5 * dt);
  velocity.y -= GRAVITY * dt;

  moveDir.set(0, 0, 0);
  if (keys.forward) moveDir.z -= 1;
  if (keys.back)    moveDir.z += 1;
  if (keys.left)    moveDir.x -= 1;
  if (keys.right)   moveDir.x += 1;
  moveDir.x += joyVec.x;
  moveDir.z += joyVec.y;
  if (moveDir.lengthSq() > 1) moveDir.normalize();

  const yaw = player.rotation.y;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  const inputX = (moveDir.x * cos + moveDir.z * sin) * MOVE_SPEED;
  const inputZ = (-moveDir.x * sin + moveDir.z * cos) * MOVE_SPEED;

  if (keys.jump && onGround) { velocity.y = JUMP_SPEED; onGround = false; }

  const pos = player.position;
  const totalX = inputX + velocity.x;
  const totalZ = inputZ + velocity.z;

  const newX = pos.x + totalX * dt;
  if (!playerCollides(newX, pos.y, pos.z)) pos.x = newX; else velocity.x = 0;
  const newZ = pos.z + totalZ * dt;
  if (!playerCollides(pos.x, pos.y, newZ)) pos.z = newZ; else velocity.z = 0;
  const newY = pos.y + velocity.y * dt;
  if (!playerCollides(pos.x, newY, pos.z)) { pos.y = newY; onGround = false; }
  else { if (velocity.y < 0) onGround = true; velocity.y = 0; }

  if (pos.y < -20) {
    pos.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
    velocity.set(0, 0, 0);
  }

  // ハイライト
  const tgt = raycastBlock();
  if (tgt) {
    highlightMesh.position.set(tgt.x + 0.5, tgt.y + 0.5, tgt.z + 0.5);
    highlightMesh.visible = true;
  } else highlightMesh.visible = false;

  // 溶岩ダメージ
  if (playerTouchesBlock(10)) {
    lavaTimer += dt;
    damageOverlayEl.style.opacity = '0.55';
    if (lavaTimer >= LAVA_DEATH_AT) {
      pos.set(SPAWN_X + 0.5, spawnFeetY + EYE_HEIGHT, SPAWN_Z + 0.5);
      velocity.set(0, 0, 0);
      lavaTimer = 0;
      damageOverlayEl.style.opacity = '0';
    }
  } else if (lavaTimer > 0) {
    lavaTimer = 0;
    damageOverlayEl.style.opacity = '0';
  }
}

function updateEntities(dt) {
  const px = player.position.x, pz = player.position.z;
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    const dx = e.group.position.x - px;
    const dz = e.group.position.z - pz;
    if (dx*dx + dz*dz < 90 * 90) e.update(dt);
    if (e.dead) { scene.remove(e.group); entities.splice(i, 1); }
  }
}

// --- 起動 ---
let worldReady = false;

function startWorldGen() {
  loadingText.textContent = 'ワールド生成中...';
  setTimeout(() => {
    generateTerrain();
    placeLava();
    placeCaveEntrances();
    clearSpawnArea();
    progressBar.style.width = '40%';
    setTimeout(() => {
      placeTrees();
      progressBar.style.width = '60%';
      setTimeout(() => {
        spawnEntities();
        progressBar.style.width = '70%';
        setTimeout(() => {
          // 初期チャンクをキューに入れる
          updateChunkStreaming();
          progressBar.style.width = '80%';
          setTimeout(() => {
            // 最初の数フレームでチャンクを集中的にロード
            const initStart = performance.now();
            while (loadQueue.length > 0 && performance.now() - initStart < 2000) {
              processLoadQueue(50);
            }
            progressBar.style.width = '100%';
            worldReady = true;
            if (isTouch) {
              blocker.style.display = 'none';
              touchUI.classList.add('active');
              pointerLocked = true;
            } else {
              loadingText.textContent = 'クリックして開始';
            }
          }, 30);
        }, 30);
      }, 30);
    }, 30);
  }, 30);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (worldReady) {
    processLoadQueue(6);
    rebuildDirtyChunks(2);
    if (pointerLocked) {
      updatePlayer(dt);
      updateEntities(dt);
      updateExplosionVisuals(dt);
      updateChunkStreaming();
      updateCoords();
    }
  }
  renderer.render(scene, camera);
}

startWorldGen();
animate();
</script>
